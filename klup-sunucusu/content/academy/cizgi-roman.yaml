            en: "' OR 1=1 -- … Bring me everything, please."
          - kim: Tilki
            metin: Parametreli sorgu. Girdi asla komut olmaz.
            tur: dusunce
            yer: sag-alt
            en: Parameterised queries. Input never becomes a command.
        ses:
          metin: ŞANGIR!
          yer: sag-ust
        en:
