  f-00-sahne:
    baslik: Yeşil havya
    paneller:
      - gorsel: f-00-a
        karakter: leman
        alt: Lehimci Leman bir atölye tezgâhında açık bir telefona, akıllı kilide ve küçük bir kameraya ucu yeşil parlayan havyasıyla kablo lehimliyor; kablolar arkadaki parlayan bir aynaya uzanıyor
        prompt: "A cluttered workbench seen at a slight angle under a hanging lamp: an opened smartphone, a small microcontroller board with a sensor, a smart door lock with its back panel off, a tiny camera and a small smart bulb. The villain leans over the bench with her magnifier goggles down, carefully soldering a thin glowing wire onto the lock's board, her tiny drone holding the wire. From every device, thin glowing green wires run to a large oval mirror in the shadows behind the bench, its surface shimmering like an eye."
        anlatici: Atölye tezgâhı. Leman havyasıyla bir telefona, bir kilide ve bir kameraya kablo lehimliyor.
        balonlar:
          - kim: Leman
            metin: Akıllı cihaz mı? Bana göre açık kapı.
            tur: konusma
            yer: sol-ust
            en: A smart device? To me it's an open door.
          - kim: Tilki
            metin: Cebimdekinden kapıdaki kilide, hepsi bir bilgisayar.
            tur: dusunce
            yer: sag-alt
            en: From the one in my pocket to the lock on the door, it's all a computer.
        ses:
          metin: CIZZ!
          yer: sag-ust
        en:
          alt: Solderer Leman solders wires to an open phone, a smart lock and a small camera on a workshop bench with her green-glowing iron; the wires run to a glowing mirror behind her
          anlatici: A workshop bench. Leman solders wires to a phone, a lock and a camera.
          ses: SIZZLE!
    en:
      baslik: The green soldering iron
  f-01-sahne:
    baslik: Aralık kapı
    paneller:
      - gorsel: f-01-a
        karakter: leman
        alt: Lehimci Leman, odaları ayrı ayrı parlayan dev bir telefon-apartmanının merdiveninde; bir odanın kapısını aralık tutan izin fişine havyasıyla dokunuyor
        prompt: A giant smartphone drawn as a tall apartment building at night, each floor a separate glowing room with its own sealed door, one small app living in each room. The villain stands on a rolling ladder outside one room whose door is propped open by an oversized permission slip marked with an abstract stamp symbol, and she peeks inside with her magnifier goggles down, her tiny drone hovering nearby holding a flashlight.
        anlatici: Odaları ayrı ayrı parlayan bir telefon-apartmanı. Leman bir kapıyı aralık tutan izin fişine dokunuyor.
        balonlar:
          - kim: Leman
            metin: Fener uygulaması rehberine neden erişmek istiyor dersin?
            tur: konusma
            yer: sol-ust
            en: Why do you think a torch app wants access to your contacts?
          - kim: Tilki
            metin: Sandbox her uygulamayı ayırır. İzni ben veririm, ben geri alırım.
            tur: dusunce
            yer: sag-alt
            en: A sandbox separates every app. I grant the permission, I take it back.
        en:
          alt: Solderer Leman on the stairway of a giant phone apartment block whose rooms each glow separately; she touches her soldering iron to a permission tag holding a door ajar
          anlatici: A phone apartment block, each room glowing. Leman touches a permission tag holding a door ajar.
    en:
      baslik: The door left ajar
  f-02-sahne:
    baslik: Manifest parşömeni
    paneller:
      - gorsel: f-02-a
        karakter: leman
        alt: Lehimci Leman tezgâhta açtığı bir APK kolisinden uzun bir manifest parşömeni çekiyor; parşömendeki kapıların bazıları ardına kadar açık
        prompt: On a cluttered workbench, an opened cardboard parcel shaped like a zip archive spills out small labelled drawers and gears. The villain pulls a long glowing scroll out of the parcel, the scroll covered with tiny drawn doors and abstract symbols, several of the little doors swinging wide open. She grins with her goggles pushed up, while her tiny drone tugs the end of the scroll across the bench.
        anlatici: Leman bir APK kolisinden uzun bir parşömen çekiyor. Bazı kapılar ardına kadar açık.
        balonlar:
          - kim: Leman
            metin: exported=true. Davetiye gibi.
            tur: konusma
            yer: sol-ust
            en: exported=true. Like an invitation.
          - kim: Tilki
            metin: Manifest uygulamanın haritasıdır. Açık bileşen, açık kapı.
            tur: dusunce
            yer: sag-alt
            en: The manifest is the app's map. An exposed component is an open door.
        en:
          alt: Solderer Leman pulls a long manifest scroll from an APK box she has opened on the bench; some of the doors drawn on the scroll are wide open
          anlatici: Leman pulls a long scroll from an APK box. Some of the doors are wide open.
    en:
      baslik: The manifest scroll
  f-03-sahne:
    baslik: Bantlı anahtar
    paneller:
      - gorsel: f-03-a
        karakter: leman
        alt: Lehimci Leman büyüteçli gözlüğüyle açılmış bir saat mekanizmasına benzeyen uygulamanın dişlileri arasına bantlanmış minik altın anahtarı buluyor
        prompt: A smartphone app drawn as an opened pocket-watch mechanism lying on a workbench, its gears and springs glowing faintly green. The villain leans in close with her magnifier goggles down, tweezers in one hand, triumphantly lifting a tiny golden key that had been taped between two gears, the key tag showing an abstract symbol. Her tiny drone shines a spotlight on the hidden spot.
        anlatici: Büyüteçli gözlük. Leman uygulamanın dişlileri arasına bantlanmış minik bir altın anahtar buluyor.
        balonlar:
          - kim: Leman
            metin: API anahtarını koda gömmüşler. Ne incelik.
            tur: konusma
            yer: sol-ust
            en: They hard-coded the API key. How refined.
          - kim: Tilki
            metin: JADX ile ben de okurum. Sır koda gömülmez.
            tur: dusunce
            yer: sag-alt
            en: I can read it too, with JADX. Secrets don't go in code.
        ses:
          metin: PARILTI!
          yer: sag-ust
        en:
          alt: Solderer Leman, in magnifying glasses, finds a tiny golden key taped among the gears of an app that looks like an opened clock mechanism
          anlatici: Magnifying glasses. Leman finds a tiny golden key taped among the app's gears.
          ses: GLINT!
    en:
      baslik: The taped key
  f-04-sahne:
    baslik: Stetoskop
    paneller:
      - gorsel: f-04-a
        karakter: leman
        alt: Lehimci Leman cam bir fanusun içindeki telefonu stetoskopla dinliyor; telefondan dışarı parlayan bir log şeridi akıyor
        prompt: A smartphone sits inside a large glass terrarium on a workbench like a specimen under study, its screen glowing. The villain presses a stethoscope against the glass, listening intently with one eyebrow raised, while a long glowing paper tape of abstract symbols spools out of a small slot in the terrarium and curls across the bench. Her tiny drone hovers above, reading the tape with a tiny magnifier.
        anlatici: Cam fanusta bir telefon. Leman stetoskopla dinliyor. Telefondan bir log şeridi akıyor.
        balonlar:
          - kim: Leman
            metin: Uygulama logcat'e parolayı yazıyor. Ne konuşkan!
            tur: konusma
            yer: sol-ust
            en: The app writes the password to logcat. So talkative!
          - kim: Tilki
            metin: Emülatörde test et, logda hassas veri arama.
            tur: dusunce
            yer: sag-alt
            en: Test in the emulator, search the logs for sensitive data.
        en:
          alt: Solderer Leman listens with a stethoscope to a phone inside a glass bell jar; a glowing log strip streams out of the phone
          anlatici: A phone in a glass jar. Leman listens with a stethoscope. A log strip streams out.
    en:
      baslik: The stethoscope
  f-05-sahne:
    baslik: Açılmayan zarf
    paneller:
      - gorsel: f-05-a
        karakter: leman
        alt: Lehimci Leman telefonla sunucu arasındaki havalı posta borusuna cam bir ek kutusu takmış; elindeki mühürlü zarf bir türlü açılmıyor
        prompt: A pneumatic tube system carries glowing envelopes from a smartphone on one side of the room to a tall server tower on the other. Halfway along, the villain has fitted a small glass junction box into the tube and is pulling envelopes out to peek at them. Most open easily, but the one in her hands carries a bright amber wax seal shaped like an abstract symbol and refuses to open no matter how she tugs, her goggles fogging up comically while her tiny drone shrugs.
        anlatici: Telefonla sunucu arasındaki borudan zarflar geçiyor. Leman'ın elindeki zarf açılmıyor.
        balonlar:
          - kim: Leman
            metin: Kendi sertifikamı koydum, neden açılmıyor?!
            tur: konusma
            yer: sol-ust
            en: I put in my own certificate, why won't it open?!
          - kim: Tilki
            metin: Sertifika doğrulaması doğru yapılırsa ortadaki adam dışarıda kalır.
            tur: dusunce
            yer: sag-alt
            en: With proper certificate validation, the man in the middle stays outside.
        ses:
          metin: KİLİT!
          yer: sag-ust
        en:
          alt: Solderer Leman has fitted a glass attachment box to the pneumatic mail tube between phone and server; the sealed envelope in her hand refuses to open
          anlatici: Envelopes pass through the tube between phone and server. Leman's envelope won't open.
          ses: CLICK!
    en:
      baslik: The envelope that won't open
  f-06-sahne:
    baslik: Beyaz bahçe
    paneller:
      - gorsel: f-06-a
        karakter: leman
        alt: Lehimci Leman yüksek duvarlı, mühürlü kapısı olan beyaz bir bahçenin dışında dronunu duvarın üstünden içeri baktırmaya çalışıyor
        prompt: A pristine walled garden with tall smooth white walls and a single gate sealed by a large glowing amber signature seal shaped like an abstract symbol. Inside, small tidy app houses each sit in their own fenced plot, and in the center stands a tiny vault. Outside the wall, the villain stands on tiptoe on a toolbox, steering her tiny drone with a little remote to peek over the top, while a single garden window on one app house has been left open.
        anlatici: Yüksek duvarlı beyaz bir bahçe. Leman dronunu duvarın üstünden içeri baktırmaya çalışıyor.
        balonlar:
          - kim: Leman
            metin: Bu bahçeye girmek neden bu kadar zor?
            tur: konusma
            yer: sol-ust
            en: Why is it so hard to get into this garden?
          - kim: Tilki
            metin: "iOS: Keychain, entitlements, sandbox. Her uygulama kendi bahçesinde."
            tur: dusunce
            yer: sag-alt
            en: "iOS: Keychain, entitlements, sandbox. Every app in its own garden."
        ses:
          metin: VIZZ!
          yer: sag-ust
        en:
          alt: Solderer Leman outside a white garden with high walls and a sealed gate, trying to get her drone to look over the wall
          anlatici: A white garden with high walls. Leman tries to get her drone to look over the wall.
          ses: WHIRR!
    en:
      baslik: The white garden
  f-07-sahne:
    baslik: Posta kutusu
    paneller:
      - gorsel: f-07-a
        karakter: leman
        alt: Lehimci Leman kampüsün ortasındaki kocaman bir posta kutusunun üstünde oturmuş, sensörlerden uçarak gelen parlayan mesaj baloncuklarını tek tek okuyor
        prompt: A miniature campus courtyard at night where tiny sensors, a smart lock and a small camera each send glowing message bubbles flying through the air toward one big old-fashioned mailbox in the center. The villain sits cross-legged on top of the mailbox, catching the bubbles one by one and reading their abstract symbols with delight, while her tiny drone happily drops a bubble of its own into the slot.
        anlatici: Kampüsün ortasında dev bir posta kutusu. Leman üstüne oturmuş, uçan mesajları okuyor.
        balonlar:
          - kim: Leman
            metin: Sensörler şifresiz konuşuyor. Ben de dinliyorum.
            tur: konusma
            yer: sol-ust
            en: The sensors talk unencrypted. So I listen.
          - kim: Tilki
            metin: MQTT'de kullanıcı adı, parola ve TLS. Herkes her konuyu okumasın.
            tur: dusunce
            yer: sag-alt
            en: MQTT needs a username, a password and TLS. Not everyone reads every topic.
        en:
          alt: Solderer Leman sits on top of a huge post box in the middle of campus, reading one by one the glowing message bubbles flying in from sensors
          anlatici: A giant post box in the middle of campus. Leman sits on it, reading the flying messages.
    en:
      baslik: The post box
  f-08-sahne:
    baslik: Dört pin
    paneller:
      - gorsel: f-08-a
        karakter: leman
        alt: Lehimci Leman bir akıllı kilidin arka kapağını açmış; içeride dört parlayan pin ve çengele asılı, üzerinde soyut bir varsayılan simgesi olan bir anahtar buluyor
        prompt: Close-up of a smart door lock on a workbench with its back panel unscrewed and lifted away. Inside the casing, a small circuit board shows a row of four glowing pins and a tiny memory chip, and hanging from a little hook beside them is a brass key with a tag marked by an abstract default symbol. The villain, goggles down, clips a tiny probe onto the pins with a satisfied smirk, her glowing green soldering iron resting safely in its stand and her tiny drone holding the unscrewed panel.
        anlatici: Akıllı kilidin arka kapağı açık. İçeride dört parlayan pin ve asılı bir anahtar.
        balonlar:
          - kim: Leman
            metin: UART, varsayılan parola, root kabuk. Üç adım.
            tur: konusma
            yer: sol-ust
            en: UART, default password, root shell. Three steps.
          - kim: Tilki
            metin: Varsayılan parola değişir, debug portu kapanır, güncelleme imzalı olur.
            tur: dusunce
            yer: sag-alt
            en: Change the default password, close the debug port, sign updates.
        ses:
          metin: TIK!
          yer: sag-ust
        en:
          alt: Solderer Leman has opened the back cover of a smart lock; inside are four glowing pins and a key hanging on a hook with an abstract default icon on it
          anlatici: The smart lock's back cover is open. Four glowing pins and a hanging key inside.
          ses: CLICK!
    en:
      baslik: Four pins
  f-09-sahne:
    baslik: Kablo köprüsü
    paneller:
      - gorsel: f-09-a
        karakter: leman
        alt: Lehimci Leman bir binanın kesit görünümünde akıllı ampulden dizüstü bilgisayara uzanan parlayan bir kablo köprüsünün üstünde sekerek yürüyor
        prompt: A cutaway view of a building floor. On the left, smart bulbs, a small camera, a thermostat and student laptops all sit together in one big open room, and the villain happily hops across a glowing cable bridge from a smart bulb straight to a laptop, her tiny drone following. On the right, the same devices sit in separate glass rooms with closed doors and only one narrow amber-lit corridor leading outside, and there is no bridge to walk on.
        anlatici: Bir binanın kesiti. Leman akıllı ampulden laptopa uzanan bir kablo köprüsünde sekiyor.
        balonlar:
          - kim: Leman
            metin: Ampulden laptopa… aynı ağda her şey yakın.
            tur: konusma
            yer: sol-ust
            en: From bulb to laptop… on the same network everything is close.
          - kim: Tilki
            metin: IoT ayrı ağda. Ampul laptopa ulaşamaz.
            tur: dusunce
            yer: sag-alt
            en: IoT goes on its own network. The bulb can't reach the laptop.
        en:
          alt: Solderer Leman hops along a glowing cable bridge running from a smart bulb to a laptop in a cutaway view of a building
          anlatici: A cutaway of a building. Leman hops along a cable bridge from bulb to laptop.
    en:
      baslik: The cable bridge
  f-10-sahne:
    baslik: Fabrika maketi
    paneller:
      - gorsel: f-10-a
        karakter: leman
        alt: Lehimci Leman cam fanus altındaki oyuncak bir fabrika maketinin büyük kolunu çevirmeye uzanıyor; maketteki minik borular ve vanalar parlıyor
        prompt: A detailed tabletop toy model of a tiny factory under a large glass dome on a workbench, with miniature conveyor belts, little pipes, valves and a small water tank glowing softly. A toy control panel with oversized dials sits in front of the dome. The villain reaches eagerly toward a big lever on the toy panel, tongue between her teeth in concentration, while her tiny drone tries to hold the glass dome shut with both little arms.
        anlatici: Cam fanusta bir fabrika maketi. Leman büyük vana koluna uzanıyor.
        balonlar:
          - kim: Leman
            metin: Modbus'ta kimlik doğrulama yok. Hiç yok!
            tur: konusma
            yer: sol-ust
            en: Modbus has no authentication. None at all!
          - kim: Tilki
            metin: OT'de bir komut gerçek dünyada bir vanayı açar. IT'den ayrı tutulur.
            tur: dusunce
            yer: sag-alt
            en: In OT a command opens a real valve. Keep it apart from IT.
        ses:
          metin: GICIRT!
          yer: sag-ust
        en:
          alt: Solderer Leman reaches for the big arm of a toy factory model under a glass dome; the tiny pipes and valves in the model glow
          anlatici: A factory model under a glass dome. Leman reaches for the big valve arm.
          ses: CREAK!
    en:
      baslik: The factory model
  f-11-sahne:
    baslik: Dev plan
    paneller:
      - gorsel: f-11-a
        karakter: leman
        alt: Lehimci Leman tezgâha bir akıllı kameranın dev planını sermiş; plandaki her giriş noktasını yeşil havyasıyla daire içine alıyor
        prompt: A large blueprint of a smart security camera spread across a workbench, held flat by a coffee mug and a spool of solder. The blueprint shows the camera's insides, its antenna, a small companion phone and a cloud drawn as a puffy shape. The villain leans over the blueprint drawing glowing green circles around little doorways on the drawing with the tip of her soldering iron, each circled doorway marked with a tiny abstract symbol, while her tiny drone counts them on its little fingers.
        anlatici: Tezgâhta akıllı bir kameranın planı. Leman her giriş noktasını yeşil havyayla daire içine alıyor.
        balonlar:
          - kim: Leman
            metin: Wi-Fi, bulut, uygulama, USB. Hangisinden girsem?
            tur: konusma
            yer: sol-ust
            en: Wi-Fi, cloud, app, USB. Which one do I come in through?
          - kim: Tilki
            metin: Ben de aynı haritayı çıkarırım. Tehdit modeli ve firmware envanteri.
            tur: dusunce
            yer: sag-alt
            en: I'd map the same. Threat model and firmware inventory.
        en:
          alt: Solderer Leman has spread the blueprint of a smart camera across the bench; she circles every entry point on it with her green soldering iron
          anlatici: A smart camera's blueprint on the bench. Leman circles every entry point with her green iron.
    en:
      baslik: The big blueprint
  f-12-sahne:
    baslik: Soğuyan havya
    paneller:
      - gorsel: f-12-a
        karakter: leman
        alt: Lehimci Leman'ın tezgâhındaki tüm cihazların kapakları vidalanmış, portları kehribar mühürlerle kapatılmış; Leman soğumuş havyasıyla oturup etkilenmiş gibi başını sallıyor
        prompt: "The same cluttered workbench from before, now neatly tidied: the smartphone, smart lock, small camera and circuit boards all have their back panels screwed shut, and every little port and pin row is covered with a glowing amber seal. The villain sits on a stool at the edge of the bench, goggles pushed up, her soldering iron cooled in its stand and her tiny drone powered down on her shoulder, nodding slowly with a reluctant impressed smile."
        anlatici: Bütün cihazların kapakları vidalı, portları mühürlü. Leman soğumuş havyasıyla oturuyor.
        balonlar:
          - kim: Leman
            metin: Hiçbir yerden giremiyorum… etkileyici.
            tur: konusma
            yer: sol-ust
            en: I can't get in anywhere… impressive.
          - kim: Tilki
            metin: Uygulama ve cihaz denetimi tamam. Bulgular önceliğe göre sıralı.
            tur: dusunce
            yer: sag-alt
            en: App and device review complete. Findings ranked by priority.
        en:
          alt: All the devices on Solderer Leman's bench have their covers screwed shut and ports sealed with amber seals; Leman sits with her cooled iron and nods, impressed
          anlatici: Every cover screwed shut, every port sealed. Leman sits with her cooled iron.
    en:
      baslik: The cooling iron
  g-00-sahne:
    baslik: Kurmalı böcekler
    paneller:
      - gorsel: g-00-a
        karakter: sabri
        alt: Saatçi Sabri, açık bir dev cep saatinin içinden sıra sıra çıkan kurmalı böceklerini gururla izliyor; böceklerden biri tezgâhtaki cam fanusun altına alınmış, büyüteçle inceleniyor
        prompt: In a dim old watchmaker's workshop, a giant pocket watch lies open on the workbench like a doorway, and a parade of glowing clockwork beetles marches out of it in a neat line toward a faintly glowing server rack in the corner. The villain watches the procession with a proud, patient smile, a tiny screwdriver in hand. At the edge of the bench, one beetle has been separated from the line and sits under a sealed glass bell jar beneath a large magnifying lens on an arm, calmly being examined.
        anlatici: Dev bir cep saatinin içinden kurmalı böcekler çıkıyor. Biri cam fanusun altında inceleniyor.
        balonlar:
          - kim: Sabri
            metin: Her biri bir sanat eseri. Hepsi benim.
            tur: konusma
            yer: sol-ust
            en: Each one a work of art. And all of them mine.
          - kim: Tilki
            metin: Bir böceği söküp çalışmasını anlayınca hepsini tanırım.
            tur: dusunce
            yer: sag-alt
            en: If I take one apart and see how it works, I'll know them all.
        ses:
          metin: TIK TAK!
          yer: sag-ust
        en:
          alt: Clockmaker Sabri watches rows of clockwork bugs crawl out of an open giant pocket watch; one bug sits under a glass dome on the bench, being examined with a magnifying glass
          anlatici: Clockwork bugs crawl out of a giant pocket watch. One is being examined under a glass dome.
          ses: TICK TOCK!
    en:
      baslik: Chapter 4 — Clockwork Bugs
  g-01-sahne:
    baslik: Fanusta şehir
    paneller:
      - gorsel: g-01-a
        karakter: sabri
        alt: Saatçi Sabri kurmalı böceğini minyatür bir şehre bırakıyor; şehrin cam bir fanusun içinde olduğunu, kablosunun çekildiğini ve yanında dev bir geri sarma düğmesi bulunduğunu fark etmiyor
        prompt: On a laboratory bench sits a sealed glass terrarium holding a tiny model city of miniature houses and glowing server towers. The villain, peering through his jeweler's loupe, lowers a glowing clockwork beetle into it through a small hatch, smiling as if the city were real. He does not notice the glass walls, the unplugged cable lying on the bench outside, or the big brass rewind knob on the side of the terrarium.
        anlatici: Sabri böceğini minyatür bir şehre bırakıyor. Şehrin cam bir fanusun içinde olduğunu bilmiyor.
        balonlar:
          - kim: Sabri
            metin: Git küçüğüm, bütün şehir senin.
            tur: konusma
            yer: sol-ust
            en: Go on, little one. The whole city is yours.
          - kim: Tilki
            metin: Yalıtılmış sanal makine, ağ kapalı, geri sarma hazır.
            tur: dusunce
            yer: sag-alt
            en: Isolated virtual machine, network off, rollback ready.
        en:
          alt: Clockmaker Sabri lowers his clockwork bug into a miniature city, not noticing that the city sits inside a glass dome with its cable pulled and a giant rewind knob beside it
          anlatici: Sabri drops his bug into a miniature city. He does not know the city is inside a glass dome.
    en:
      baslik: Chapter 4 — City Under Glass
  g-02-sahne:
    baslik: Saatin içi
    paneller:
      - gorsel: g-02-a
        karakter: sabri
        alt: Saatçi Sabri dev bir cep saatinin arka kapağını dolap gibi açmış; içi başlık plakası, dişli çekmecesi, kavanoz rafı ve ödünç alet listesi gibi bölmelere ayrılmış, bir çekmecede kurmalı böcek kıvrılmış yatıyor
        prompt: "The villain swings open the hinged back of a giant pocket watch as if it were a cabinet. Inside are neatly stacked compartments: a small brass header plate at the top engraved with abstract symbols, a drawer full of turning gears, a shelf of tiny glass jars, and a rolled-up scroll listing borrowed tools. In one drawer a clockwork beetle lies curled up, pretending to be an ordinary gear. The villain looks proud of his tidy hiding place."
        anlatici: Sabri dev bir saatin arka kapağını açıyor. İçi başlık plakası, çekmeceler ve raflarla dolu.
        balonlar:
          - kim: Sabri
            metin: PE dosyası benim saatim. İçini kimse bilmez.
            tur: konusma
            yer: sol-ust
            en: The PE file is my watch. Nobody knows what's inside.
          - kim: Tilki
            metin: Başlık, bölümler, import tablosu. Haritası belli.
            tur: dusunce
            yer: sag-alt
            en: Header, sections, import table. The map is right there.
        en:
          alt: Clockmaker Sabri has opened the back of a giant pocket watch like a cupboard; the inside is divided into compartments — header plate, gear drawer, jar shelf and a borrowed-tools list — with a clockwork bug curled up asleep in one drawer
          anlatici: "Sabri opens the back of a giant watch. Inside: a header plate, drawers and shelves."
    en:
      baslik: Chapter 4 — Inside the Watch
  g-03-sahne:
    baslik: Dişli kulesi
    paneller:
      - gorsel: g-03-a
        karakter: sabri
        alt: Saatçi Sabri bir mile dişlileri üst üste diziyor; minik böcekler tezgâhtaki pirinç kaplar arasında dişli taşıyor, arkada makaslı bir oyuncak ray ikiye ayrılıyor
        prompt: At a long workbench the villain carefully stacks brass gears onto a tall vertical spindle one by one, last on and first off. A few tiny clockwork beetles hop between eight small brass cups lined up on the bench, each beetle carrying a single glowing gear from cup to cup. Behind him a toy railway track splits at a junction with a lever, and a little beetle-driven train waits for him to decide which way to switch it.
        anlatici: Sabri bir mile dişlileri üst üste diziyor. Arkada makaslı bir ray ikiye ayrılıyor.
        balonlar:
          - kim: Sabri
            metin: push, push, pop. Benim dans adımlarım.
            tur: konusma
            yer: sol-ust
            en: push, push, pop. Those are my dance steps.
          - kim: Tilki
            metin: Stack son giren ilk çıkar. jmp ile ray değişir.
            tur: dusunce
            yer: sag-alt
            en: The stack is last in, first out. jmp switches the track.
        ses:
          metin: ŞAK!
          yer: sag-ust
        en:
          alt: Clockmaker Sabri stacks gears onto a shaft; tiny bugs carry gears between brass bowls on the bench, and behind him a toy track with points splits in two
          anlatici: Sabri stacks gears onto a shaft. Behind him, a track with points splits in two.
          ses: SNAP!
    en:
      baslik: Chapter 4 — The Gear Tower
  g-04-sahne:
    baslik: Buruşuk paket
    paneller:
      - gorsel: g-04-a
        karakter: sabri
        alt: Saatçi Sabri kurmalı böceğini kat kat buruşuk kâğıda sarıyor; yanındaki pirinç terazi paketin şüpheli ağırlığıyla bir yana yatmış
        prompt: At his workbench the villain wraps a small clockwork beetle in layer after layer of crumpled paper and twine, like a gift that never ends, sweating with comic effort. A growing pile of paper scraps surrounds him, and a hanging brass scale beside the bench tips heavily under the tiny bundle, hinting at its suspicious density. A faint glow of the beetle still leaks through one torn corner.
        anlatici: Sabri böceğini kat kat kâğıda sarıyor. Terazi şüpheli ağırlıkla bir yana yatmış.
        balonlar:
          - kim: Sabri
            metin: Sardım, paketledim. Kimse içini göremez.
            tur: konusma
            yer: sol-ust
            en: Wrapped it, packed it. Nobody can see inside.
          - kim: Tilki
            metin: "Yüksek entropi: paketlenmiş. Strings az: saklıyor."
            tur: dusunce
            yer: sag-alt
            en: "High entropy: packed. Few strings: hiding something."
        ses:
          metin: GICIRT!
          yer: sag-ust
        en:
          alt: Clockmaker Sabri wraps his clockwork bug in layer after layer of crumpled paper; the brass scale beside him tips over at the parcel's suspicious weight
          anlatici: Sabri wraps his bug in layer after layer of paper. The scale tips over at the suspicious weight.
          ses: CRINKLE!
    en:
      baslik: Chapter 4 — The Crumpled Parcel
  g-05-sahne:
    baslik: Pirinç iğneler
    paneller:
      - gorsel: g-05-a
        karakter: sabri
        alt: Saatçi Sabri kurduğu böceğin her birkaç adımda bir raya takılmış pirinç iğnelerde donup kaldığını görünce cep saatine sinirle vuruyor
        prompt: On a long brass track laid across a workbench, the villain winds up a large clockwork beetle and lets it go, but every few steps it freezes mid-motion at tiny brass pins pushed into the track at precise spots. A magnifying lens on a jointed arm hovers over the frozen beetle, revealing its glowing inner gears. The villain taps his pocket watch in comic frustration, his loupe slipping from his eye.
        anlatici: Sabri'nin böceği her birkaç adımda bir pirinç iğnelerde donup kalıyor.
        balonlar:
          - kim: Sabri
            metin: Yürü! Neden duruyorsun?!
            tur: konusma
            yer: sol-ust
            en: Walk! Why are you stopping?!
          - kim: Tilki
            metin: Breakpoint koydum. Her adımı ben izlerim.
            tur: dusunce
            yer: sag-alt
            en: I set a breakpoint. I watch every step.
        ses:
          metin: DUR!
          yer: sag-ust
        en:
          alt: Clockmaker Sabri angrily strikes his pocket watch as his bug freezes at the brass pins stuck in the track every few steps
          anlatici: Sabri's bug freezes on the brass pins every few steps.
          ses: STOP!
    en:
      baslik: Chapter 4 — Brass Pins
  g-06-sahne:
    baslik: Cam kabuk
    paneller:
      - gorsel: g-06-a
        karakter: sabri
        alt: Saatçi Sabri cam kabuklu böceğinin bütün dişlilerinin dışarıdan görünmesine bozuluyor ve üstünü minik bir bezle örtmeye çalışıyor; arkadaki perdeye böceğin düzgün montaj şeması yansıyor
        prompt: On the workbench stands a clockwork beetle with a fully transparent glass shell, every gear and spring inside clearly visible. Behind it a projector casts a neat, perfectly readable assembly diagram of the same beetle onto a hanging screen, drawn with abstract symbols and arrows. The villain, dismayed, hurriedly tries to cover the glass shell with a tiny embroidered cloth that is far too small.
        anlatici: Cam kabuklu böceğin bütün dişlileri görünüyor. Sabri üstünü bir bezle örtmeye çalışıyor.
        balonlar:
          - kim: Sabri
            metin: .NET'te yazdım diye okunur mu?!
            tur: konusma
            yer: sol-ust
            en: Just because I wrote it in .NET, does that make it readable?!
          - kim: Tilki
            metin: IL neredeyse kaynak kod gibi. dnSpy ile açarım.
            tur: dusunce
            yer: sag-alt
            en: IL is almost like source code. I'll open it with dnSpy.
        en:
          alt: Clockmaker Sabri is annoyed that every gear of his glass-shelled bug is visible from outside and tries to cover it with a tiny cloth; the bug's neat assembly diagram is projected on the curtain behind
          anlatici: Every gear of the glass-shelled bug is on show. Sabri tries to cover it with a cloth.
    en:
      baslik: Chapter 4 — The Glass Shell
  g-07-sahne:
    baslik: Vitrin
    paneller:
      - gorsel: g-07-a
        karakter: sabri
        alt: "Saatçi Sabri vitrinindeki böcek koleksiyonunu kuyumcu gibi sunuyor: biri hediye kutusunda saklanıyor, biri sıra sıra kopyalarına bölünüyor, biri bir sandığı zincirle kilitliyor, biri anahtar deliğinden gözetliyor"
        prompt: "In an old watchmaker's shop window at night, a velvet display tray presents a lineup of clockwork beetles, each with its own quirk: one hiding inside an elegant ribboned gift box, one splitting into a line of tiny identical copies marching away, one wrapping a small treasure chest in chains with a padlock, and one peeking through a keyhole with a tiny spyglass. The villain presents them proudly with an open palm, like a jeweler showing his finest collection."
        anlatici: "Sabri böcek koleksiyonunu kuyumcu gibi sunuyor: biri hediye kutusunda, biri kopyalanıyor, biri kilit takıyor."
        balonlar:
          - kim: Sabri
            metin: Truva atı, solucan, fidye, casus. Hepsi el yapımı.
            tur: konusma
            yer: sol-ust
            en: Trojan, worm, ransomware, spy. All handmade.
          - kim: Tilki
            metin: Türü fark etmez. Hepsinin kalıcılık için bir yere tutunması gerek.
            tur: dusunce
            yer: sag-alt
            en: The type doesn't matter. Each one has to hold on somewhere for persistence.
        en:
          alt: "Clockmaker Sabri presents his bug collection like a jeweller: one hides in a gift box, one splits into row after row of copies, one chains a chest shut, one peers through a keyhole"
          anlatici: "Sabri shows off his collection like a jeweller: one in a gift box, one copying itself, one fitting a lock."
    en:
      baslik: Chapter 4 — The Display Case
  g-08-sahne:
    baslik: Kildeki izler
    paneller:
      - gorsel: g-08-a
        karakter: sabri
        alt: Saatçi Sabri, böceğinin yumuşak kil üzerinde bıraktığı ayak izlerine ve duvardaki boyalı sahte kapıya fırlattığı kâğıt uçağa bozularak bakıyor; çevredeki pirinç aletler her adımı kaydediyor
        prompt: On a laboratory table covered with a smooth sheet of soft clay, a clockwork beetle walks along, leaving a perfect trail of tiny footprints, scratch marks around a little drawer it opened, and a small paper airplane it has launched toward a door painted on the wall that is only a flat picture. Brass recording instruments with needles and dials surround the table, tracing every movement onto paper rolls. The villain watches from the side in dismay, loupe in hand.
        anlatici: Böcek yumuşak kilde izler bırakmış. Pirinç aletler her adımı kaydediyor.
        balonlar:
          - kim: Sabri
            metin: Hiç iz bırakmaz dedim!
            tur: konusma
            yer: sol-ust
            en: I said it leaves no trace!
          - kim: Tilki
            metin: Dosya, registry, ağ. Her davranış bir IOC.
            tur: dusunce
            yer: sag-alt
            en: File, registry, network. Every behaviour is an IOC.
        en:
          alt: Clockmaker Sabri scowls at the footprints his bug left in soft clay and at the paper plane he threw at a fake door painted on the wall; the brass tools around him record every step
          anlatici: The bug left footprints in the soft clay. The brass tools record every step.
    en:
      baslik: Chapter 4 — Tracks in the Clay
  g-09-sahne:
    baslik: Taşan fincan
    paneller:
      - gorsel: g-09-a
        karakter: sabri
        alt: Saatçi Sabri raftaki küçük bir fincana durmadan dişli döküyor; taşan dişliler yandaki fincandaki dönüş oku pulunu deviriyor, ama raftaki pirinç nöbetçi kanarya ötmeye başlamış
        prompt: On a wooden shelf stands a neat row of small porcelain cups. The villain pours an endless stream of tiny brass gears into one small cup; it overflows and the gears spill into the neighboring cup, knocking over a little brass token shaped like a curved return arrow. Just beside the cups, a small brass canary figurine has sprung up and is singing an alarm, and the villain freezes mid-pour with a guilty grin.
        anlatici: Sabri küçük bir fincana durmadan dişli döküyor. Taşanlar yandaki fincanı deviriyor. Kanarya ötüyor.
        balonlar:
          - kim: Sabri
            metin: Biraz daha… biraz daha…
            tur: konusma
            yer: sol-ust
            en: A little more… just a little more…
          - kim: Tilki
            metin: Sınırı kontrol etmeyen kopya, yanındaki belleği ezer. Canary bunu yakalar.
            tur: dusunce
            yer: sag-alt
            en: A copy that ignores its limit overwrites the memory beside it. The canary catches that.
        ses:
          metin: CİK CİK!
          yer: sag-ust
        en:
          alt: Clockmaker Sabri keeps pouring gears into a small cup on the shelf; the overflowing gears knock over the return-arrow token in the cup beside it, and the brass canary on the shelf has started to sing
          anlatici: Sabri keeps pouring gears into a small cup. The overflow knocks over the next cup. The canary sings.
          ses: CHIRP!
    en:
      baslik: Chapter 4 — The Overflowing Cup
  g-10-sahne:
    baslik: Dönen koridor
    paneller:
      - gorsel: g-10-a
        karakter: sabri
        alt: Saatçi Sabri, kapıları dişliler üzerinde dönüp her göz kırpışta yer değiştiren bir saat kulesi koridorunda artık tutmayan haritasına bakıyor; böceği kaygan, kehribar ışıklı bir rafa tırmanamayıp kayıyor
        prompt: Inside a grand clocktower corridor, a row of wooden doors rides on huge rotating gears and keeps swapping places, so the paper map in the villain's hands no longer matches anything. Nearby, his clockwork beetle tries to climb onto a shelf glowing with a soft amber stop symbol and slides right off its slick, polished surface. The villain scratches his bald head under his loupe, comically puzzled.
        anlatici: Saat kulesi koridoru. Kapılar her göz kırpışta yer değiştiriyor. Sabri'nin haritası tutmuyor.
        balonlar:
          - kim: Sabri
            metin: Dün buradaydı! Adres değişmiş!
            tur: konusma
            yer: sol-ust
            en: It was here yesterday! The address has changed!
          - kim: Tilki
            metin: ASLR adresleri karıştırır, DEP veriyi çalıştırmaz.
            tur: dusunce
            yer: sag-alt
            en: ASLR shuffles the addresses; DEP won't run data.
        ses:
          metin: TIK TAK!
          yer: sag-ust
        en:
          alt: In a clock-tower corridor where doors turn on gears and change place at every blink, Clockmaker Sabri stares at his map that no longer holds; his bug cannot climb a smooth, amber-lit shelf and slips back down
          anlatici: A clock-tower corridor. The doors move at every blink. Sabri's map no longer holds.
          ses: TICK TOCK!
    en:
      baslik: Chapter 4 — The Turning Corridor
  g-11-sahne:
    baslik: Ayıklama makinesi
    paneller:
      - gorsel: g-11-a
        karakter: sabri
        alt: Saatçi Sabri birbirinin aynısı böceklerini pirinç bir ayıklama makinesinin önünden geçirmeye çalışıyor; makinenin mercekli kolu her birini kabuğundaki desenden tanıyıp cam kavanoza bırakıyor
        prompt: At a workshop gate, the villain tiptoes a neat row of identical-looking clockwork beetles past a large brass sorting machine. The machine's jointed mechanical arm, fitted with a pattern-matching magnifying lens, recognizes the distinctive swirl pattern on each beetle's shell and plucks them one by one into a big glass jar. The villain stares open-mouthed, his loupe popping off his eye.
        anlatici: Sabri aynı böcekleri bir makineden geçirmeye çalışıyor. Makine her birini desenden tanıyıp kavanoza atıyor.
        balonlar:
          - kim: Sabri
            metin: Rengini değiştirdim, yine mi?!
            tur: konusma
            yer: sol-ust
            en: I changed its colour, and still?!
          - kim: Tilki
            metin: YARA deseni yakalar. Davranış kuralı kılığı.
            tur: dusunce
            yer: sag-alt
            en: YARA catches the pattern — a behaviour rule in disguise.
        ses:
          metin: TAK! TAK!
          yer: sag-ust
        en:
          alt: Clockmaker Sabri tries to run his identical bugs past a brass sorting machine; the machine's lensed arm recognises each one by the pattern on its shell and drops it into a glass jar
          anlatici: Sabri runs identical bugs past a machine. It knows each by its pattern and drops it in a jar.
          ses: CLICK! CLICK!
    en:
      baslik: Chapter 4 — The Sorting Machine
  g-12-sahne:
    baslik: Duran kule
    paneller:
      - gorsel: g-12-a
        karakter: sabri
        alt: Saatçi Sabri durdurulmuş saat kulesinin önünde tabureye çökmüş; her dişli kehribar bir kıskaçla sabitlenmiş, böcekleri cam kavanozlarda sıra sıra dizilmiş
        prompt: Inside a towering clockwork mechanism, every great gear has been gently held still by a small glowing amber clamp, and the giant clock hands are frozen just before the hour. Rows of glass jars on a shelf hold the clockwork beetles, neatly sorted and resting. The villain sits on a low stool at the foot of the mechanism, his loupe in his lap, nodding slowly as if quietly impressed.
        anlatici: Sabri durdurulmuş saat kulesinin önünde tabureye çökmüş. Böcekler kavanozlarda.
        balonlar:
          - kim: Sabri
            metin: Bütün eserlerim… etiketlenmiş.
            tur: konusma
            yer: sol-ust
            en: All my works… labelled.
          - kim: Tilki
            metin: Örnek, davranış, IOC, tespit kuralı. Rapor tamam.
            tur: dusunce
            yer: sag-alt
            en: Sample, behaviour, IOC, detection rule. The report is done.
        en:
          alt: Clockmaker Sabri slumps on a stool in front of the stopped clock tower; every gear is held fast by an amber clamp, and his bugs are lined up in glass jars
          anlatici: Sabri slumps on a stool before the stopped clock tower. The bugs are in jars.
    en:
      baslik: Chapter 4 — The Stopped Tower
