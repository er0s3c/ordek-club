# ============================================================================
#  Gölge Ağ çizgi romanı. Sayfalara ::cizgi[şerit-id] ile yerleşir (src/lib/comic.ts).
#  Paneller YAZISIZ üretilir; anlatici (anlatıcı kutusu) ve balonlar platformda gerçek metin olarak çizilir.
#  prompt İngilizce; {selim}, {tilki} gibi yer tutucular tarifler: ile açılır; "the villain" yazan panelde karakter zorunlu.
#  balon: kim · metin (≤100) · tur: konusma | dusunce | fisilti · yer: sol-ust | sag-ust | sol-alt | sag-alt
#  Promptlar `npm run academy:gorseller` ile GORSELLER.md'ye üretilir (--ar 4:3).
# ============================================================================
tarifler:
  selim: Selim Hoca, a calm professor in his early 40s with round wire glasses, a short graying beard and a worn tweed jacket over a dark turtleneck, a thin folder always under his arm
  tilki: Tilki, a slim young student analyst of unspecified gender, hood of a dark charcoal jacket always up with two small fox-ear shaped tips, a rust-orange scarf pulled over the nose and mouth so only sharp curious amber eyes show, dark cargo trousers, worn sneakers, a small spiral notebook in hand
  genc-selim: a young man about twenty with round glasses and a worried face, wearing a gray hoodie
  genc-jasmine: a young woman about twenty with a high ponytail fastened with a white jasmine flower, wearing a dark hoodie
seritler:
  onsoz:
    baslik: Ön söz — Yirmi yıl önce
    paneller:
      - gorsel: p-09-a
        karakter: eren-genc
        alt: "Yirmi yıl önce bodrum laboratuvarında üç kapüşonlu genç: Eren laptopuna sırıtıyor, Jasmine heyecanla izliyor, Selim onu durdurmaya uzanıyor"
        prompt: Flashback twenty years ago in a cramped university basement lab at night lit only by old monitors. The villain grins at his laptop glowing green. Beside him a young woman with a high ponytail and a jasmine flower in her hair leans in excitedly, while a third young man with round glasses and a worried face reaches out a hand as if to stop him. Tangled cables, old computers and a single dangling bulb, slightly faded sepia flashback tint.
        anlatici: "Yirmi yıl önce. Bir üniversitenin bodrum laboratuvarında üç genç: Eren, Selim ve Jasmine. Kendilerine Kapüşonlular diyorlar."
        en:
          alt: "Twenty years ago in a basement lab: three hooded students — Eren grinning at his laptop, Jasmine watching eagerly, Selim reaching out to stop him"
          anlatici: "Twenty years ago. Three students in a university basement lab: Eren, Selim and Jasmine. They call themselves the Hoods."
      - gorsel: cizgi-onsoz-2
        alt: Eski monitörün yeşil ışığında üç genç yüz; ekranda açık bir kasa kapısı biçimi
        prompt: "Close-up on a dusty old monitor in a basement lab at night, its green glow reflecting on three young faces leaning in: {genc-selim} on the left, a hooded young man with a silver streak of hair in the middle, {genc-jasmine} on the right. On the screen only abstract glowing shapes of an open vault door."
        anlatici: Bir gece liman bankasının sisteminde bir açık buluyorlar.
        balonlar:
          - kim: Selim
            metin: Bildirelim.
            tur: konusma
            yer: sol-ust
            en: We should report it.
        en:
          alt: In the green glow of an old monitor, three young faces; on the screen, the shape of an open vault door
          anlatici: One night they find a flaw in a harbour bank's systems.
      - gorsel: cizgi-onsoz-3
        karakter: eren-genc
        alt: Genç Eren sırıtarak parmaklarının arasında parlayan altın bir anahtarı tutuyor
        prompt: The villain, a hooded young man, turns toward the viewer with a defiant grin, holding up a small glowing gold key on a chain between two fingers, the basement lab blurred behind him, green light on half his face.
        balonlar:
          - kim: Eren
            metin: Bu bir anahtar. Anahtarı veren, kapıyı da verir.
            tur: konusma
            yer: sag-ust
            en: This is a key. Whoever gives the key gives the door too.
        ses:
          metin: ŞIK!
          yer: sol-alt
        en:
          alt: Young Eren grinning, holding a golden key glinting between his fingers
          ses: CLICK!
      - gorsel: cizgi-onsoz-4
        alt: Sabah boş kalmış iki sandalye ve klavyenin üstünde katlanmış tek bir not; kapıda yalnız Selim
        prompt: Early morning light falls through a high basement window onto an empty desk with two abandoned chairs and a cold laptop; a single folded paper note lies on the keyboard. {genc-selim} stands alone in the doorway, frozen.
        anlatici: "Jasmine, Eren’in yanında kalıyor. Sabah ikisi de yok. Masada tek satırlık bir not:"
        balonlar:
          - kim: Not
            metin: Kapı açıktı. Ben sadece içeri girdim. — E.
            tur: fisilti
            yer: sag-alt
            en: The door was open. I just walked in. — E.
        en:
          alt: Two empty chairs in the morning and a single folded note on the keyboard; only Selim in the doorway
          anlatici: "Jasmine stays with Eren. By morning both are gone. On the desk, a one-line note:"
    devam: Kapı o gece açıldı. Yirmi yıldır kapanmadı.
    en:
      baslik: Prologue — Twenty Years Ago
      devam: The door opened that night. It has never closed.
  bugun:
    baslik: Bugün
    paneller:
      - gorsel: cizgi-bugun-1
        karakter: don
        alt: Liman şehrine bakan balkonda Don Gölge; arkasındaki duvarda çok daha büyük bir gölge
        prompt: A wide night view of a Mediterranean harbor city with old warehouses and cranes; in the foreground the villain sits in a high-backed leather chair on a balcony, cigar smoke curling, while behind him a much larger shadow with a faint silver streak of hair looms against the wall.
        anlatici: "Liman şehrinin eski kaçakçılık ailesi artık Gölge Ağ. Görünen başı Don Gölge. Ama Don bile birine borçlu: yüzünü kimsenin görmediği Baron."
        ses:
          metin: FUUU…
          yer: sag-ust
        en:
          alt: Don Shadow on a balcony overlooking the harbour city; a far larger shadow on the wall behind him
          anlatici: "The harbour city's old smuggling family is now the Shadow Network. Its public head is Don Shadow. But even Don owes someone: the Baron, whose face no one has seen."
          ses: WHOOO…
      - gorsel: cizgi-bugun-2
        alt: Selim Hoca kampüsteki kulüp odasının duvarına kalkan biçimli bir amblem asıyor
        prompt: "{selim} pins a simple shield-shaped emblem onto the wall of a small campus clubroom at night, a few desks with laptops and a whiteboard covered in arrows behind him, warm lamp light."
        anlatici: "Selim artık bir hoca. Kampüste Kalkan'ı kurdu: saldırmayan, savunan; delil toplayıp yetkililere teslim eden bir ekip."
        balonlar:
          - kim: Selim
            metin: Kapıyı kırmayız. Kapatırız.
            tur: konusma
            yer: sag-ust
            en: We don't break doors. We close them.
        en:
          alt: Professor Selim hanging a shield-shaped emblem on the wall of the campus clubroom
          anlatici: "Selim is a professor now. On campus he founded the Shield: a team that defends rather than attacks, gathering evidence and handing it to the authorities."
      - gorsel: cizgi-bugun-3
        alt: Selim Hoca arkası dönük Tilki'ye üzerinde kalkan amblemi olan ince bir dosya uzatıyor
        prompt: "{selim} hands a thin case folder to {tilki} across a desk under a single lamp; we see Tilki from behind, the folder bearing a small shield emblem, rain on the window."
        anlatici: Ve bu dönem seni seçti.
        balonlar:
          - kim: Selim
            metin: Kod adın Tilki. Tilki iz bırakmaz ama her izi okur.
            tur: konusma
            yer: sol-ust
            en: Your codename is Fox. A fox leaves no tracks but reads every one.
        en:
          alt: Professor Selim handing a slim dossier marked with the shield emblem to Fox, whose back is turned
          anlatici: And this term, he chose you.
    devam: "İlk dosya masanda. Adı: Tatlı Dil Tevfik."
    en:
      baslik: Today
      devam: "Your first file is on your desk. Name: Smooth-Talking Tevfik."
  tevfik-acilis:
    baslik: Bölüm 1 — Bursun Onaylandı
    en:
      baslik: "Chapter 1 — Your Scholarship Is Approved"
      devam: "You're one click away. Finish this chapter before you click."
    paneller:
      - gorsel: cizgi-tevfik-acilis-1
        en:
          alt: "During enrolment week, dozens of students in the courtyard look at their phones at the same time; the same gold envelope on every screen"
          anlatici: "Enrolment week. The same message lands on hundreds of phones across campus."
          ses: "BEEP! BEEP!"
        alt: Kayıt haftasında avluda onlarca öğrenci aynı anda telefonuna bakıyor; bütün ekranlarda aynı altın zarf
        prompt: A crowded campus courtyard during registration week, dozens of students looking down at their phones at the same moment, every screen glowing with the same golden envelope symbol.
        anlatici: Kayıt haftası. Kampüste yüzlerce telefona aynı mesaj düşüyor.
        balonlar:
          - kim: Mesaj
            metin: Bursun onaylandı! 24 saat içinde onayla.
            en: "Your scholarship is approved! Confirm within 24 hours."
            tur: fisilti
            yer: sag-ust
        ses:
          metin: BİP! BİP! BİP!
          yer: sag-ust
      - gorsel: cizgi-tevfik-acilis-2
        en:
          alt: "Smooth-Talking Tevfik grinning with his gold tooth, typing on two phones at once in a back room"
        karakter: tevfik
        alt: Arka odada iki telefonla aynı anda yazan, altın dişiyle sırıtan Tatlı Dil Tevfik
        prompt: The villain in a smoky back room grins with his gold tooth, typing on two glowing phones at once, a wall behind him covered with glowing fake message cards.
        balonlar:
          - kim: Tevfik
            metin: Bir tık yeter, canım. Sadece bir tık.
            en: "One click is all it takes, dear. Just one click."
            tur: konusma
            yer: sol-ust
      - gorsel: cizgi-tevfik-acilis-3
        en:
          alt: "Professor Selim examines the gold envelope on the phone, Fox at his side"
        alt: Selim Hoca telefondaki altın zarfı inceliyor, Tilki yanında
        prompt: "{selim} holds up a phone showing the golden envelope, studying it through his glasses, while {tilki} leans in beside him in the clubroom."
        balonlar:
          - kim: Selim
            metin: "Bu imzayı tanıyorum: Tatlı Dil Tevfik."
            en: "I know this signature: Smooth-Talking Tevfik."
            tur: konusma
            yer: sol-ust
          - kim: Selim
            metin: İlk görevin, yemini tanımak.
            en: "Your first job: recognise the bait."
            tur: konusma
            yer: sag-alt
    devam: Bir tık uzaktasın. Tıklamadan önce bu bölümü bitir.
  tevfik-kapanis:
    baslik: Dosya kapandı — Tatlı Dil Tevfik
    en:
      baslik: "Case closed — Smooth-Talking Tevfik"
      devam: "Next chapter: a lawyer who lives in the loopholes of the law."
    paneller:
      - gorsel: m01-07-a
        en:
          alt: "Smooth-Talking Tevfik sulking at the police station; his two phones in an evidence bag, a red stamp coming down on the file"
          anlatici: "Tevfik's trap fell flat, and the fake site was taken down."
        karakter: tevfik
        alt: Karakolda somurtan Tatlı Dil Tevfik; iki telefonu delil poşetinde, dosyaya kırmızı damga basılıyor
        prompt: "A dim office hallway at night: the villain sits sulking on a wooden bench, his two phones sealed inside a transparent evidence bag on the counter beside him, his gold-tooth grin finally gone. In the foreground a hand presses a big red rubber stamp onto a closed case folder."
        anlatici: Tevfik'in tuzağı boşa çıktı, sahte site kapandı.
        balonlar:
          - kim: Tevfik
            metin: Bu kadar dikkatli öğrenci de olmaz ki...
            en: "Students just aren't supposed to be this careful..."
            tur: dusunce
            yer: sag-ust
      - gorsel: cizgi-tevfik-kapanis-2
        en:
          alt: "The last call on the phone in the evidence bag goes to a law office"
          anlatici: "But the last call on his phone goes to a law office."
          ses: "RRRING!"
        alt: Delil poşetindeki telefonda bir avukat bürosuna giden son arama
        prompt: Close-up of a confiscated phone inside a transparent evidence bag on a table, its screen lit with an outgoing call icon toward a small building symbol with a scale of justice.
        anlatici: Ama telefonundaki son arama bir avukat bürosuna gidiyor.
        balonlar:
          - kim: Tevfik
            metin: Kemal Bey, bir çocuk izimize düştü.
            en: "Mr Kemal, some kid is on our trail."
            tur: fisilti
            yer: sol-alt
        ses:
          metin: DIRRRN!
          yer: sag-ust
    devam: "Sonraki bölümde: kanunun boşluklarında yaşayan bir avukat."
  kemal-acilis:
    baslik: Bölüm 2 — Yetki Belgesi
    paneller:
      - gorsel: cizgi-kemal-acilis-1
        karakter: kemal
        alt: Avukat Kemal masasından kışkırtıcı mühürlü bir zarfı uzatıyor
        prompt: The villain sits in his wood-paneled office behind piles of contracts, sliding a tempting sealed envelope across the desk toward the viewer with a sly smile, one eyebrow raised.
        balonlar:
          - kim: Kemal
            metin: Şu sisteme bir göz atsan kimin haberi olur?
            tur: konusma
            yer: sag-ust
            en: Who would even notice if you took one look at that system?
        ses:
          metin: ŞLAK!
          yer: sol-alt
        en:
          alt: Lawyer Kemal slides a tempting sealed envelope across his desk
          ses: SLAP!
      - gorsel: cizgi-kemal-acilis-2
        alt: "İki kapı arasında Tilki: biri imzalı izin belgeli, diğeri kırmızı bantlı"
        prompt: "A dark hallway with two doors: one with a glowing signed permission document pinned on it, the other crossed by red tape, {tilki} standing between them seen from behind."
        anlatici: "Plan basit: seni izinsiz bir sisteme sokmak. Bir kez kuralı çiğnersen bütün deliller çöpe gider, suçlu sen olursun."
        en:
          alt: "Fox between two doors: one with a signed letter of authority, the other sealed with red tape"
          anlatici: "The plan is simple: get you into a system without permission. Break the rule once and all the evidence is worthless — you become the criminal."
      - gorsel: cizgi-kemal-acilis-3
        alt: Selim Hoca masadaki mühürlü izin belgesini gösteriyor
        prompt: "{selim} taps a signed permission document with a wax seal on the clubroom table, {tilki} nodding."
        balonlar:
          - kim: Selim
            metin: Bu bölümde silahın kod değil, izin.
            tur: konusma
            yer: sol-ust
            en: In this chapter your weapon isn't code. It's permission.
        en:
          alt: Professor Selim points at the sealed letter of authority on the desk
    devam: Tek bir izinsiz tık ve suçlu sen olursun.
    en:
      baslik: Chapter 2 — Letter of Authority
      devam: One click without permission and you're the criminal.
  kemal-kapanis:
    baslik: Dosya kapandı — Avukat "Boşluk" Kemal
    paneller:
      - gorsel: m02-07-a
        karakter: kemal
        alt: Mahkeme salonunda Avukat Kemal kendi uzun sözleşmesine dolanıp düşüyor; savunma masasında yeşil mühürlü izin belgesi
        prompt: "A dim wood-paneled courtroom: the villain's endless contract scroll has unrolled across the floor and tangled around his own legs, and he topples over as his briefcase flies open. On the defense table, a neat signed permission document with a green wax seal glows calmly under a lamp."
        anlatici: Tuzağa düşmedin; dosyandaki her delil imzalı ve izinli.
        en:
          alt: In the courtroom Lawyer Kemal trips over his own long contract; a green-sealed letter of authority sits on the defence desk
          anlatici: You didn't take the bait; every piece of evidence in your file is signed and authorised.
      - gorsel: cizgi-kemal-kapanis-2
        karakter: kemal
        alt: Kemal masasında aynı koğuştan iki adamın eski fotoğrafını çeviriyor
        prompt: The villain sits alone at his desk at night, turning over an old faded photograph with a trembling hand; the photo shows two men in prison uniforms side by side, one tall and gaunt with a key ring, one short and muscular with a stethoscope.
        anlatici: "Kemal masasındaki eski fotoğrafı çeviriyor: aynı koğuştan iki adam — bir çilingir ve bir kasa hırsızı."
        ses:
          metin: GICIRT…
          yer: sag-ust
        en:
          alt: Kemal at his desk turns over an old photo of two men from the same prison wing
          anlatici: "Kemal turns over the old photo on his desk: two men from the same prison wing — a locksmith and a safecracker."
          ses: CREAK…
    devam: "Sonraki bölümde: anahtarı unuttuğun her kapıyı açan adam."
    en:
      baslik: Case closed — Lawyer "Loophole" Kemal
      devam: "Next chapter: the man who opens every door whose key you forgot."
  riza-acilis:
    baslik: Bölüm 3 — Ana Anahtar
    paneller:
      - gorsel: cizgi-riza-acilis-1
        alt: Gece yarısı laboratuvarda bilgisayarlar kendiliğinden tek tek açılıyor
        prompt: A dark university computer lab at three in the morning, every monitor switching on by itself one after another, an empty chair slowly spinning.
        anlatici: Kulübün laboratuvar bilgisayarları geceleri kendi kendine açılıyor.
        ses:
          metin: VIIIN!
          yer: sag-ust
        en:
          alt: At midnight in the lab, computers switch themselves on one by one
          anlatici: The Club's lab computers switch themselves on at night.
          ses: WHIRR!
      - gorsel: cizgi-riza-acilis-2
        karakter: riza
        alt: Anahtarcı Rıza bir bilgisayarın yanındaki gizli kilide altın ana anahtarı sokuyor
        prompt: The villain slips a glowing golden master key into a hidden keyhole on the side of a computer tower, squinting with a sly smile, his huge ring of keys jingling.
        balonlar:
          - kim: Rıza
            metin: Ben hiçbir şey kırmam. Siz anahtarı unutursunuz.
            tur: konusma
            yer: sag-ust
            en: I never break anything. You're the ones who forget the key.
        en:
          alt: Locksmith Rıza slides a golden master key into a hidden lock beside a computer
      - gorsel: cizgi-riza-acilis-3
        alt: Tilki fenerle bilgisayarın başlangıç panelinde gizlenmiş küçük anahtarı buluyor
        prompt: "{tilki} shines a flashlight into a computer's startup panel where a tiny extra key is taped, {selim} watching over the shoulder."
        balonlar:
          - kim: Selim
            metin: Yönetici yetkisi kapılmış ve başlangıca saklanmış.
            tur: konusma
            yer: sol-ust
            en: Admin rights were captured and hidden in startup.
        en:
          alt: Fox with a torch finds a small key hidden in the computer's startup panel
    devam: Gece yarısı. Laboratuvarda bir ekran daha kendiliğinden yanıyor.
    en:
      baslik: Chapter 3 — The Master Key
      devam: Midnight. Another screen in the lab switches itself on.
  riza-kapanis:
    baslik: Dosya kapandı — Anahtarcı Rıza
    paneller:
      - gorsel: m03-07-a
        karakter: riza
        alt: Anahtarcı Rıza havalandırma boşluğunda anahtarlığıyla sıkışmış; arkadaki bilgisayarlarda yeşil kalkanlar parlıyor
        prompt: The villain is stuck halfway through a narrow air vent in a computer lab at night, his giant keyring snagged on the vent edge, legs kicking in the air. Behind him a row of laptops glow with calm green shield icons.
        anlatici: Arka kapı kapandı; makineler güncel ve kilitli.
        en:
          alt: Locksmith Rıza stuck in a ventilation shaft with his keyring; green shields glow on the computers behind him
          anlatici: The backdoor is closed; the machines are patched and locked.
      - gorsel: cizgi-riza-kapanis-2
        alt: Yerde düşmüş anahtarlık; bir anahtarda sunucu odasını gösteren küçük bir etiket
        prompt: A dropped key ring lying on a lab floor under a flashlight beam, one key bearing a small paper tag with a tiny drawing of a server rack and a crown.
        anlatici: "Rıza'nın düşürdüğü anahtarlıkta bir etiket var:"
        balonlar:
          - kim: Etiket
            metin: Sadri Usta'ya — sunucu odası.
            tur: fisilti
            yer: sag-alt
            en: To Master Sadri — the server room.
        ses:
          metin: ŞINGIR!
          yer: sag-ust
        en:
          alt: A dropped keyring on the floor; one key carries a small tag showing the server room
          anlatici: "There's a tag on the keyring Rıza dropped:"
          ses: JINGLE!
    devam: "Sonraki bölümde: eski veri merkezinin yaşlı kralı."
    en:
      baslik: Case closed — Locksmith Rıza
      devam: "Next chapter: the old king of an abandoned data centre."
  sadri-acilis:
    baslik: Bölüm 4 — Kök
    paneller:
      - gorsel: cizgi-sadri-acilis-1
        alt: Şehrin terk edilmiş eski veri merkezi; en uçta tek bir sunucu hâlâ yeşil yanıp sönüyor
        prompt: The abandoned old data center of the harbor city at night, rows of dusty server racks, only one rack at the far end still blinking green.
        anlatici: Şehrin eski veri merkezinde, kimsenin dokunmadığı bir sunucuda yaşlı bir adam oturuyor.
        en:
          alt: The city's abandoned old data centre; at the far end one server still blinks green
          anlatici: In the city's old data centre, an old man sits at a server nobody has touched.
      - gorsel: cizgi-sadri-acilis-2
        karakter: sadri
        alt: Süper Kullanıcı Sadri sunucu tahtında herkese anahtar dağıtıyor
        prompt: The villain sprawls on his throne of server racks, glowing green monocle, handing out shining keys to anyone who passes with a careless wave of his hand.
        balonlar:
          - kim: Sadri
            metin: Herkese tam yetki! Kim uğraşacak izinlerle?
            tur: konusma
            yer: sag-ust
            en: Full authorization for everyone! Who has time for permissions?
        ses:
          metin: HA HA HA!
          yer: sol-alt
        en:
          alt: Superuser Sadri on his server throne hands out keys to everyone
          ses: HA HA HA!
      - gorsel: cizgi-sadri-acilis-3
        alt: Selim Hoca terminal başındaki kapüşonlu bir gencin eski fotoğrafına dalgın bakıyor
        prompt: "{selim} looks at an old faded photograph of a hooded teenager at a terminal, his face troubled, {tilki} beside him."
        anlatici: Söylenene göre yirmi yıl önce kapüşonlu bir gence ilk terminalini o açtı.
        en:
          alt: Professor Selim gazes absently at an old photo of a hooded youth at a terminal
          anlatici: They say that twenty years ago he opened a hooded kid's first terminal.
    devam: "Terminali açmadan önce bil: o da seni izliyor."
    en:
      baslik: Chapter 4 — Root
      devam: "Before you open that terminal, know this: it's watching you too."
  sadri-kapanis:
    baslik: Dosya kapandı — Süper Kullanıcı Sadri
    paneller:
      - gorsel: m04-07-a
        karakter: sadri
        alt: Süper Kullanıcı Sadri devrilen sunucu tahtının önünde yerde, çatlak monokluyla; bütün sunucu ışıkları sakin yeşil
        prompt: In a server room the villain's throne of server racks has toppled over; he sits on the floor amid tangled cables holding his cracked green monocle, stunned, while every server light around him has turned a calm steady green.
        anlatici: Sadri'nin tahtı devrildi.
        ses:
          metin: GÜM!
          yer: sag-ust
        en:
          alt: Superuser Sadri on the floor before his toppled server throne, cracked monocle; every server light calm green
          anlatici: Sadri's throne has toppled.
          ses: THUD!
      - gorsel: cizgi-sadri-kapanis-2
        alt: Selim Hoca gece terminalde vurgulanmış tek bir satıra uzun uzun bakıyor
        prompt: "{selim} sits alone in front of a glowing green terminal at night, staring at one highlighted line on the screen made of abstract glowing marks, his glasses reflecting the light, completely still."
        anlatici: "Loglarda unuttuğu tek satır kaldı: yirmi yıllık bir kullanıcı adı, “eren”. Selim Hoca uzun süre konuşmuyor."
        en:
          alt: Professor Selim stares at a single highlighted line on the terminal late at night
          anlatici: "One line he forgot remains in the logs: a twenty-year-old username, “eren”. Professor Selim says nothing for a long time."
    devam: "Sonraki bölümde: fırın-kafede herkesi dinleyen kulak."
    en:
