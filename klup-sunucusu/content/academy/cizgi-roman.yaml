        prompt: The grand ventriloquist stage from before, now quiet under a single amber spotlight. The translucent robot puppet sits alone on a stool, its glowing strings neatly cut and coiled on the floor, a small amber shield badge glowing on its chest. At the edge of the stage the villain holds an empty white glove, his famous frozen smile finally slipping into a surprised open mouth.
        anlatici: Sahnenin kenarında boş eldivenli Veysel. İpleri kesilmiş kukla göğsünde bir rozetle oturuyor.
        balonlar:
          - kim: Veysel
            metin: Artık beni dinlemiyor.
            tur: konusma
            yer: sol-ust
            en: It doesn't listen to me any more.
          - kim: Tilki
            metin: Ayna'nın değerlendirmesi tamam. Bulgular, riskler, önlemler.
            tur: dusunce
            yer: sag-alt
            en: The Mirror's assessment is complete. Findings, risks, controls.
        en:
          alt: Ventriloquist Veysel stands baffled at the edge of the stage with an empty glove; the robot puppet, strings cut, sits on its own with an amber shield badge on its chest
          anlatici: Empty-gloved Veysel at the edge of the stage. The puppet, strings cut, sits with a badge on its chest.
