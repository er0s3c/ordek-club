        alt: Vantrolog Veysel, parlayan ses ve yüz kavanozlarıyla dolu sahne deposunun koridorunda uzaklaşırken dönüp eldivenli parmağını dudağına götürüyor; ön planda karanlık ekranında bir göz yansıyan telefon
        prompt: A dark backstage storage room filled with endless rows of glass jars on tall shelves, each jar holding a softly glowing swirl shaped like a sound wave, a face silhouette or a folded message. In the foreground a smartphone lies face up on a wooden crate, a tiny reflection of a watching eye on its dark screen. Down the aisle, the villain walks away, glances back over his shoulder and raises a gloved finger to his perfectly still lips.
        anlatici: "Ayna'nın eğitim verisinde Gölge Ağ'ın yıllardır topladığı her şey var: sesler, yazışmalar, yüzler. Baron şehrin bir kopyasını kuruyor."
        en:
          alt: Ventriloquist Veysel walks down the corridor of a stage store full of glowing jars of voices and faces, then turns and puts a gloved finger to his lips; in the foreground a phone with an eye reflected on its dark screen
          anlatici: "Mirror's training data holds everything the Shadow Network has collected for years: voices, messages, faces. The Baron is building a copy of the city."
      - gorsel: cizgi-veysel-kapanis-2
        karakter: veysel
        alt: Veysel sahneden inerken izleyiciye eğilip fısıldıyor
        prompt: The villain steps down from a dim stage, leaning close to the viewer and whispering, his puppet silent, a single spotlight behind him.
        balonlar:
          - kim: Veysel
            metin: Ayna'nın gözleri sizin cebinizde, Tilki.
            tur: fisilti
            yer: sag-ust
            en: Mirror's eyes are in your pocket, Fox.
        ses:
          metin: ÇIT!
          yer: sol-alt
        en:
          alt: Veysel steps down from the stage and leans towards the reader, whispering
          ses: CREAK!
    devam: "Sonraki bölümde: kampüsün kilitleri kendi kendine açılıyor."
    en:
      baslik: Case closed — Ventriloquist Veysel
      devam: "Next chapter: the campus locks are opening themselves."
  leman-acilis:
    baslik: Sezon 2 — Gözler
    paneller:
      - gorsel: cizgi-leman-acilis-1
        alt: Gece yurt koridorunda kilitler kendiliğinden açılıyor, kameralar Tilki'yi izliyor
        prompt: "A campus dormitory corridor at night: smart door locks clicking open by themselves, small cameras on the ceiling all turning to follow {tilki}."
        anlatici: Kampüsteki akıllı kilitler gece kendi kendine açılıyor, kameralar boş koridorları değil seni izliyor.
        ses:
          metin: KLİK!
          yer: sag-ust
        en:
          alt: In a dorm corridor at night the locks open by themselves, cameras watching Fox
          anlatici: The smart locks on campus are opening by themselves at night, and the cameras are watching you, not the empty corridors.
          ses: CLICK!
      - gorsel: cizgi-leman-acilis-2
        karakter: leman
        alt: Lehimci Leman atölyesinde devre kartına minik bir kamera lehimliyor
        prompt: The villain in her workshop solders a tiny camera onto a circuit board, goggles on her forehead, a small drone hovering over her shoulder.
        balonlar:
          - kim: Leman
            metin: Varsayılan parola hiç değişmez. Hep aynı kapı.
            tur: konusma
            yer: sag-ust
            en: The default password never changes. Always the same door.
        en:
          alt: Solderer Leman solders a tiny camera onto a circuit board in her workshop
      - gorsel: cizgi-leman-acilis-3
        alt: Tilki laboratuvar tezgâhında akıllı kilidin kapağını açıyor
        prompt: "{tilki} at a lab workbench opens a smart lock's casing with a small screwdriver, a list of devices pinned on the wall."
        anlatici: Her cihazı aç, her kapıyı bul, her varsayılan parolayı değiştir.
        en:
          alt: Fox opens the casing of a smart lock on the lab bench
          anlatici: Open every device, find every door, change every default password.
    devam: Varsayılan parola. Her cihazda aynı kapı.
    en:
      baslik: Season 2 — Eyes
      devam: Default password. The same door on every device.
  leman-kapanis:
    baslik: Dosya kapandı — Lehimci Leman
    paneller:
      - gorsel: f-12-b
        karakter: leman
        alt: Boş tezgâhta yarım kalmış bir devre kartının içinde minik mekanik bir böcek; kartın arkasında kazınmış soyut simgeler, kapıda uzaklaşan Leman ve dronunun silüeti
        prompt: An empty workbench under a single hanging lamp in a dark workshop. In the center lies a half-finished circuit board, and nestled among its components is a tiny clockwork beetle glowing faintly green. The back edge of the board is engraved with small abstract symbols catching the lamplight. In the doorway behind, the villain's silhouette with goggles on her forehead walks away into the dark, her tiny drone following over her shoulder.
        anlatici: Kameralar kapandı, kilitler yeniden programlandı. Tezgâhta yarım kalmış bir kart; içinde minik, mekanik bir böcek.
        ses:
          metin: CIZZ!
          yer: sag-ust
        en:
          alt: On an empty bench, a tiny mechanical bug inside a half-finished circuit board; abstract symbols scratched on the back of the board, and in the doorway the receding silhouettes of Leman and her drone
          anlatici: The cameras are down, the locks reprogrammed. On the bench, a half-finished board; inside it, a tiny mechanical bug.
          ses: FZZZT!
      - gorsel: cizgi-leman-kapanis-2
        alt: Tilki kartı çeviriyor; arkasında cep saati ve böcek çizimi kazınmış
        prompt: "{tilki} turns the half-finished circuit board over under a lamp; on its back a small engraved drawing of a pocket watch and a beetle."
        balonlar:
          - kim: Not
            metin: Sabri Usta'ya teslim.
            tur: fisilti
            yer: sag-alt
            en: Deliver to Clockmaker Sabri.
        en:
          alt: Fox turns the board over; a pocket watch and a beetle are scratched on the back
    devam: "Sonraki bölümde: belirli bir saatte uyanacak bir böcek."
    en:
      baslik: Case closed — Solderer Leman
      devam: "Next chapter: a bug that will wake at a set hour."
  sabri-acilis:
    baslik: Sezon 2 — Saat İşliyor
    paneller:
      - gorsel: cizgi-sabri-acilis-1
        alt: Sunucunun derinliklerinde sırtında minik bir saat tıkırdayan uyuyan mekanik böcek
        prompt: Deep inside a server, among the cables, a tiny mechanical beetle sleeps curled up, a miniature clock on its back ticking.
        anlatici: "Kampüs ağında uyuyan bir şey var: belirli bir saatte uyanacak, kendini kopyalayacak ve Ayna'yı besleyecek."
        en:
          alt: Deep inside a server, a sleeping mechanical bug with a tiny clock ticking on its back
          anlatici: "Something is sleeping in the campus network: it will wake at a set hour, copy itself and feed Mirror."
      - gorsel: cizgi-sabri-acilis-2
        karakter: sabri
        alt: Saatçi Sabri atölyesinde minik bir anahtarla mekanik böceği kuruyor
        prompt: The villain in his watchmaker workshop winds up a clockwork beetle with a tiny key, a jeweler's loupe over one eye, a patient smile.
        balonlar:
          - kim: Sabri
            metin: Acele etmem. Her şeyin bir saati var.
            tur: konusma
            yer: sag-ust
            en: No rush. Everything has its hour.
        ses:
          metin: TIK TAK!
          yer: sol-alt
        en:
          alt: Clockmaker Sabri winds the mechanical bug with a tiny key in his workshop
          ses: TICK TOCK!
      - gorsel: cizgi-sabri-acilis-3
        alt: Tilki izole laboratuvarda böceği cımbızla cam kubbenin altına koyuyor
        prompt: "{tilki} in an isolated analysis lab with thick glass walls, placing the beetle under a glass dome with tweezers."
        anlatici: Böceği güvenle aç, nasıl çalıştığını anla, saati durdur.
        en:
          alt: Fox places the bug under a glass dome with tweezers in the isolation lab
          anlatici: Open the bug safely, learn how it works, stop the clock.
    devam: Böcek uyumadan önce saati durdur.
    en:
      baslik: Season 2 — The Clock Is Ticking
      devam: Stop the clock before the bug wakes.
  sabri-kapanis:
    baslik: Dosya kapandı — Saatçi Sabri
    paneller:
      - gorsel: g-12-b
        karakter: sabri
        alt: Kadife bir örtü üzerinde açılmış mekanik bir böceğin içinde parlayan eski bir altın anahtar; yanındaki küçük aynada uzaktan uyanan belirsiz bir ışık var
        prompt: On a velvet cloth lies an opened clockwork beetle, its shell hinged back. Inside, among the tiny gears, rests a small old golden key glowing faintly. Next to it a little hand mirror reflects a dim, distant glow, as if something were slowly waking up inside the glass. In the shadows of the workshop behind, the villain's silhouette with his loupe turns away while the pendulum of a tall clock keeps swinging.
        anlatici: "Saat durdu. Böceğin içindeki imza anahtarı yirmi yıl öncesine gidiyor: o gece liman bankasında kullanılan anahtar."
        ses:
          metin: DUR!
          yer: sag-ust
        en:
          alt: An old gold key glowing inside an opened mechanical bug on a velvet cloth; in the small mirror beside it, a vague light waking in the distance
          anlatici: "The clock has stopped. The signature key inside the bug goes back twenty years: the key used at the harbour bank that night."
          ses: STOP!
      - gorsel: cizgi-sabri-kapanis-2
        alt: Karanlık odada içten ışıyan büyük bir ayna; çerçevesinde geri sayan ışık halkaları
        prompt: A large mirror in a dark room slowly lights up from within, a countdown of glowing ring segments circling its frame, {tilki} and {selim} reflected in it.
        anlatici: "Ve son satır yeni bir geri sayım başlatıyor; bitişi, Ayna'nın uyanacağı gece. Sezon 3: Ayna."
        en:
          alt: A large mirror glowing from within in a dark room, rings of light counting down in its frame
          anlatici: "And the last line starts a new countdown; it ends on the night Mirror wakes. Season 3: Mirror."
    devam: "Sezon 3: Ayna. Geri sayım başladı."
    en:
      baslik: Case closed — Clockmaker Sabri
      devam: "Season 3: Mirror. The countdown has begun."
  p-02-sahne:
    baslik: Haritadaki üç nokta
    paneller:
      - gorsel: p-02-a
        karakter: don
        alt: Don Gölge masasında, şehir haritası üzerinde kırmızı iplerle bağlanmış üç işaretli noktaya bakıyor
        prompt: The villain sits behind a heavy wooden desk in a smoky office lit by a green-shaded banker's lamp, studying a large city map pinned with three glowing markers (a small house made of circuit boards, a fork splitting into seven paths, a theater stage) connected by red string. His raised eyebrow shows he senses a long campaign ahead.
        anlatici: "Don Gölge'nin masası. Haritada üç kırmızı nokta: kampüs, liman, eski veri merkezi."
        balonlar:
          - kim: Don
            metin: Otuz hafta sonra bu şehir benim olacak.
            tur: konusma
            yer: sol-ust
            en: In thirty weeks this city will be mine.
          - kim: Tilki
            metin: Otuz hafta sonra ben de hazır olacağım.
            tur: dusunce
            yer: sag-alt
            en: In thirty weeks I'll be ready too.
        en:
          alt: Don Shadow at his desk, studying three marked points on a city map linked with red string
          anlatici: "Don Shadow's desk. Three red points on the map: the campus, the harbour, the old data centre."
    en:
      baslik: Three points on the map
  p-03-sahne:
    baslik: Rozet panosu
    paneller:
      - gorsel: p-03-a
        karakter: don
        alt: Don Gölge, mantar panoda giderek parlayan dört rozeti öfkeyle inceliyor
        prompt: In a dim back room, the villain glares at a corkboard where four hexagonal badges are pinned in a rising row (a shield, a terminal window, a magnifying glass over a circuit, a trophy), each glowing brighter than the last. Cigar smoke curls around him; he loosens his tie in irritation.
        anlatici: Mantar panoda dört rozet. Her biri bir Kalkan analistinin seviyesini gösteriyor.
        balonlar:
          - kim: Don
            metin: Bu rozetler parlıyorsa biri bizi izliyor demek.
            tur: konusma
            yer: sol-ust
            en: If these badges are glowing, someone is watching us.
          - kim: Tilki
            metin: Birincisi benim olacak.
            tur: dusunce
            yer: sag-alt
            en: The first one will be mine.
        ses:
          metin: ÇAT!
          yer: sag-ust
        en:
          alt: Don Shadow angrily studying four badges on a cork board that are glowing brighter and brighter
          anlatici: Four badges on the cork board. Each shows the level of a Shield analyst.
          ses: SNAP!
    en:
      baslik: The badge board
  p-05-sahne:
    baslik: Yedi kapı
    paneller:
      - gorsel: p-05-a
        karakter: don
        alt: Don Gölge, karanlık bir salonda yedi farklı renkte parlayan kapıyı meydan okur gibi gösteriyor
        prompt: The villain stands in the center of a dark marble hall with seven tall glowing doorways arranged in an arc behind him, each glowing a different muted color and showing a simple symbol (a browser window, a network of nodes, a radar screen, a magnifying glass over a globe, a neural network, a smartphone with a chip, a gear). He gestures toward them with his cigar like a challenge.
        anlatici: Karanlık bir salon. Yedi kapı, yedi renk, yedi dosya.
        balonlar:
          - kim: Don
            metin: Hangi kapıyı açarsan aç, arkasında biri seni bekliyor.
            tur: konusma
            yer: sol-ust
            en: Whichever door you open, someone is waiting behind it.
          - kim: Tilki
            metin: O zaman en çok merak ettiğim kapıdan başlarım.
            tur: dusunce
            yer: sag-alt
            en: Then I'll start with the door I'm most curious about.
        en:
          alt: Don Shadow in a dark hall, defiantly presenting seven doors glowing in different colours
          anlatici: A dark hall. Seven doors, seven colours, seven files.
    en:
      baslik: Seven doors
  p-06-sahne:
    baslik: Demo Day
    paneller:
      - gorsel: p-06-a
        karakter: don
        alt: Demo Day sahnesinde öğrenciler sunum yaparken Don Gölge arka sırada gerginlikle kravatını gevşetiyor
        prompt: "A small university auditorium: three confident students present on stage in front of a screen showing an abstract network diagram and charts. In the dark back row, the villain sits alone, nervously loosening his burgundy tie, sweat on his brow, his cigar trembling."
        anlatici: Demo Day. Sahnede öğrenciler bulgularını anlatıyor; arka sırada biri kravatını gevşetiyor.
        balonlar:
          - kim: Don
            metin: Bu çocuklar… bizim yöntemimizi anlatıyor!
            tur: fisilti
            yer: sol-ust
            en: These kids… they're describing our methods!
          - kim: Selim
            metin: Her bulgu bir savunmayla biter. Kuralı unutmayın.
            tur: konusma
            yer: sag-alt
            en: Every finding ends with a defence. Don't forget the rule.
        en:
          alt: Students presenting on the Demo Day stage while Don Shadow, in the back row, loosens his tie in tension
          anlatici: Demo Day. Students on stage explain their findings; in the back row, someone loosens his tie.
    en:
      baslik: Demo Day
  p-08-sahne:
    baslik: Palmiyenin arkası
    paneller:
      - gorsel: p-08-a
        karakter: nuri
        alt: Kampüs avlusundaki gece etkinliğinde Dinleyici Nuri bir palmiyenin arkasına saklanmış, takımları dinliyor
        prompt: "A lively evening event in a university courtyard under string lights: student teams gather around tables with laptops and blank clue cards, a large screen shows a glowing question mark. Hidden behind a palm tree in the foreground, the villain listens in with his parabolic dish, comically failing to stay unnoticed."
        anlatici: Gece etkinliği. Takımlar bulmaca çözüyor; palmiyenin arkasında kulaklıklı bir gölge.
        balonlar:
          - kim: Nuri
            metin: Takım adları, parolalar, ipuçları… hepsi havada!
            tur: fisilti
            yer: sol-ust
            en: Team names, passwords, clues… all of it in the air!
          - kim: Tilki
            metin: Ortak Wi-Fi'de konuşurken dikkat. Biri dinliyor olabilir.
            tur: dusunce
            yer: sag-alt
            en: Careful when talking on shared Wi-Fi. Someone may be listening.
        ses:
          metin: ÇITIR!
          yer: sag-ust
        en:
          alt: At a night event in the campus courtyard, Listener Nuri hides behind a palm tree, listening to the teams
          anlatici: Night event. Teams are solving a puzzle; behind the palm tree, a shadow with headphones.
          ses: RUSTLE!
    en:
      baslik: Behind the palm tree
  m01-01-sahne:
    baslik: Oltadaki ekran
    en:
      baslik: "The screen on the hook"
    paneller:
      - gorsel: m01-01-a
        en:
          alt: "A student looks at their phone on a campus bench at night while Smooth-Talking Tevfik dangles glowing fishing lines from behind a lamp post"
          anlatici: "Midnight, a campus bench. A phone buzzes."
          ses: "BEEP!"
        karakter: tevfik
        alt: Gece kampüs bankında telefonuna bakan öğrenciye, Tatlı Dil Tevfik lamba direğinin arkasından parlayan oltalar uzatıyor
        prompt: A university student sits on a campus bench at night using a phone, a laptop and student card beside them. From behind a lamppost, the villain dangles several glowing fishing lines with message-bubble hooks toward the phone, grinning with his gold tooth.
        anlatici: Gece yarısı, kampüs bankı. Bir telefon titriyor.
        balonlar:
          - kim: Tevfik
            metin: Bir tık, canım. Sadece bir tık.
            en: "One click, dear. Just one click."
            tur: konusma
            yer: sol-ust
          - kim: Tilki
            metin: Bu mesaj neden tam şimdi geldi?
            en: "Why did this message arrive right now?"
            tur: dusunce
            yer: sag-alt
        ses:
          metin: BİP!
          yer: sag-ust
  m01-02-sahne:
    baslik: Üç ışık
    en:
      baslik: "Three lights"
    paneller:
      - gorsel: m01-02-a
        en:
          alt: "Smooth-Talking Tevfik sweating between red, blue and purple spotlights in an interrogation room"
          anlatici: "The interrogation room. Three lights — red, blue and purple — on the same man."
        karakter: tevfik
        alt: Sorgu odasında Tatlı Dil Tevfik kırmızı, mavi ve mor spot ışıkları arasında terliyor
        prompt: "A dim noir questioning room: the villain sits on a metal chair at a small table, sweating, caught between three spotlights shining from different sides, one red, one blue, one purple. His two phones lie confiscated on the table, screens dark."
        anlatici: Sorgu odası. Kırmızı, mavi ve mor üç ışık aynı adamın üstünde.
        balonlar:
          - kim: Tevfik
            metin: Ben hacker değilim! Ben… iletişim uzmanıyım.
            en: "I'm not a hacker! I'm… a communications expert."
            tur: konusma
            yer: sol-ust
          - kim: Selim
            metin: Hacker merak eder. Sen sadece kandırıyorsun.
            en: "A hacker is curious. You just deceive."
            tur: konusma
            yer: sag-alt
  m01-03-sahne:
    baslik: Kumdaki izler
    en:
      baslik: "Footprints in the sand"
    paneller:
      - gorsel: m01-03-a
        en:
          alt: "On a beach, Smooth-Talking Tevfik collects icons from a student's glowing footprints and stuffs them into a sack"
          anlatici: "The beach. A student's traces are glowing: location, card, holiday photo."
        karakter: tevfik
        alt: Tatlı Dil Tevfik kumsalda bir öğrencinin bıraktığı parlayan ayak izlerinden simgeleri toplayıp çuvala dolduruyor
        prompt: A beach at dusk where a line of glowing footprints leads away into the distance, each footprint emitting a small floating icon (camera, location pin, heart, speech bubble, calendar). The villain follows the trail with a magnifying glass, plucking the icons and stuffing them into a burlap sack.
        anlatici: "Kumsal. Bir öğrencinin bıraktığı izler parlıyor: konum, kart, tatil fotoğrafı."
        balonlar:
          - kim: Tevfik
            metin: Ne güzel. Kendi hikâyesini kendi anlatmış.
            en: "Lovely. They told their own story for me."
            tur: konusma
            yer: sol-ust
          - kim: Tilki
            metin: Az paylaş, geç paylaş, gizli paylaş.
            en: "Share less, share later, share privately."
            tur: dusunce
            yer: sag-alt
  m01-04-sahne:
    baslik: Sahte matbaa
    en:
      baslik: "The fake print shop"
    paneller:
      - gorsel: m01-04-a
        en:
          alt: "Smooth-Talking Tevfik's back-room print shop churning out glowing fake cards themed on scholarships, jobs and rentals"
          anlatici: "Tevfik's back room. The press keeps printing fake scholarship, job and rental cards."
          ses: "CLACK!"
        karakter: tevfik
        alt: "Tatlı Dil Tevfik'in arka oda matbaası: burs, iş ve kiralık ev temalı parlayan sahte kartları basıyor"
        prompt: "A cramped smoky back-room print shop lit by green monitor glow: the villain cranks an old printing press that spits out glowing holographic cards showing a graduation cap with coins, a briefcase and a small house with a key (no readable text). Dozens of phones buzz on the shelves around him."
        anlatici: Tevfik'in arka odası. Matbaa durmadan sahte burs, iş ve ev kartları basıyor.
        balonlar:
          - kim: Tevfik
            metin: Aciliyet ekle, biraz da "son şans". Tutar.
            en: "Add urgency, and a little \"last chance\". It works."
            tur: konusma
            yer: sol-ust
          - kim: Tilki
            metin: Acele + gizli bilgi isteği = alarm.
            en: "Rush + a request for secrets = alarm."
            tur: dusunce
            yer: sag-alt
        ses:
          metin: TAK TAK!
          yer: sag-ust
  m01-05-sahne:
    baslik: Reddedilen zarf
    en:
      baslik: "The rejected envelope"
    paneller:
      - gorsel: m01-05-a
        en:
          alt: "In his back room, Smooth-Talking Tevfik glares at a fake scholarship envelope stamped with a red rejection mark; his two phones are silent"
          anlatici: "The next morning. Tevfik's favourite envelope has come back, with a red stamp on it."
          ses: "SLAM!"
        karakter: tevfik
        alt: Tatlı Dil Tevfik arka odada, üstüne kırmızı ret damgası basılmış sahte burs zarfına sinirle bakıyor; iki telefonu sessiz
        prompt: "A dim back office after hours: the villain slumps in a creaky chair glaring at a returned fake scholarship envelope stamped with a big red rejection mark, his two phones lying silent and dark on the desk, a single green monitor glow lighting his annoyed face."
        anlatici: "Ertesi sabah. Tevfik'in en sevdiği zarf geri dönmüş: üstünde kırmızı bir damga."
        balonlar:
          - kim: Tevfik
            metin: Kim fark etti bunu? Kim?!
            en: "Who spotted this? Who?!"
            tur: konusma
            yer: sol-ust
          - kim: Tilki
            metin: Alan adını harf harf okuyan biri.
            en: "Someone who read the domain letter by letter."
            tur: dusunce
            yer: sag-alt
        ses:
          metin: PAT!
          yer: sag-ust
  m01-06-sahne:
    baslik: Askıdaki şapkalar
    en:
      baslik: "Hats on the rack"
    paneller:
      - gorsel: m01-06-a
        en:
          alt: "Smooth-Talking Tevfik eyes a coat rack hung with security professionals' hats nervously"
          anlatici: "A coat rack: analyst, penetration tester, forensic investigator… every hat is a profession."
        karakter: tevfik
        alt: Tatlı Dil Tevfik, güvenlik uzmanlarının şapkalarının asılı olduğu askılığa endişeyle bakıyor
        prompt: "A coat rack in a dim hallway holds the hats and gear of different security professionals: a detective hat, an analyst headset, a lab coat, a hard hat with a small radar antenna. The villain stares at it nervously like a lineup of the people who will hunt him, clutching his phones."
        anlatici: "Bir askılık: analist, sızma testçisi, adli bilişimci… her şapka bir meslek."
        balonlar:
          - kim: Tevfik
            metin: Bu kadar çok şapka… hepsi beni mi arıyor?
            en: "So many hats… are they all looking for me?"
            tur: dusunce
            yer: sol-ust
          - kim: Selim
            metin: Hangisi sana uyuyor? Dene, gör.
            en: "Which one fits you? Try them on and see."
            tur: konusma
            yer: sag-alt
  m02-01-sahne:
    baslik: Yasaklı kapı
    paneller:
      - gorsel: m02-01-a
        karakter: kemal
        alt: Avukat Kemal, izin belgeli kapı yerine kırmızı yasak bariyerli kapıyı gösteriyor
        prompt: "Two identical doors side by side in a marble corridor: the left door has a signed scroll with a green wax seal on its handle and soft green light, the right door has a glowing red barrier. The villain stands between them pointing slyly toward the red door, his long contract dragging on the floor."
        anlatici: "Kemal'in bürosu. İki kapı: biri imzalı izinle açılıyor, diğeri kırmızı bantla kapalı."
        balonlar:
          - kim: Kemal
            metin: Kırmızı kapı daha kısa yol. Kimse bilmez.
            tur: konusma
            yer: sol-ust
            en: The red door is the shortcut. Nobody will know.
          - kim: Tilki
            metin: İzin yoksa tek tuşa basılmaz.
            tur: dusunce
            yer: sag-alt
            en: Without permission, you don't press a single key.
        en:
          alt: Lawyer Kemal points at a red-barred forbidden door instead of the door with a signed permit
          anlatici: "Kemal's office. Two doors: one opens with a signed permit, the other is sealed with red tape."
    en:
      baslik: The forbidden door
  m02-02-sahne:
    baslik: Hileli terazi
    paneller:
      - gorsel: m02-02-a
        karakter: kemal
        alt: Avukat Kemal, veri küpü ile kanun kitabını tartan terazinin kefesine gizlice parmağıyla bastırıyor
        prompt: A brass scale on a stone pedestal with a glowing locked data cube on one pan and a thick closed law book on the other. The villain leans in with a sly smile, secretly pressing one finger on the pan to tip the balance, glancing around to see if anyone notices.
        anlatici: Kanun kitabı bir kefede, kişisel veriler öbüründe. Kemal'in parmağı terazide.
        balonlar:
          - kim: Kemal
            metin: Kanun mu? Kanun, okuyabilene göredir.
            tur: konusma
            yer: sol-ust
            en: The law? The law is whatever the reader makes of it.
          - kim: Tilki
            metin: '"Ne kadar zarar verdin?"den önce "izin var mıydı?" sorulur.'
            tur: dusunce
            yer: sag-alt
            en: Before "how much damage did you do?" comes "was there permission?"
        en:
          alt: Lawyer Kemal secretly presses a finger on the pan of the scales weighing a data cube against a law book
          anlatici: The law book on one pan, personal data on the other. Kemal's finger is on the scales.
    en:
      baslik: The rigged scales
  m02-03-sahne:
    baslik: Kesik çizgi
    paneller:
      - gorsel: m02-03-a
        karakter: kemal
        alt: Avukat Kemal, test kapsamını gösteren planda yasak odaların içinden kendi kesik çizgisini çiziyor
        prompt: "A large blueprint of a fictional office building on a desk: some rooms outlined with glowing green borders, others shaded red and crossed out. The villain uses his fountain pen to draw his own dotted line straight through the forbidden red rooms, smirking."
        anlatici: Test planı masada. Kemal yasak odaların içinden kendi kesik çizgisini çiziyor.
        balonlar:
          - kim: Kemal
            metin: Kapsam dışı mı? Ben ona "bonus" derim.
            tur: konusma
            yer: sol-ust
            en: Out of scope? I call that a bonus.
          - kim: Tilki
            metin: Yazılı izin, net kapsam, yasaklı işler. Yedi parça.
            tur: dusunce
            yer: sag-alt
            en: Written permission, clear scope, forbidden actions. Seven pieces.
        ses:
          metin: ÇİZ!
          yer: sag-ust
        en:
          alt: Lawyer Kemal draws his own dotted line through the forbidden rooms on the plan showing the test scope
          anlatici: The test plan on the table. Kemal draws his own dotted line through the forbidden rooms.
          ses: SKRITCH!
    en:
      baslik: The dotted line
  m02-04-sahne:
    baslik: Arka sokak teklifi
    paneller:
      - gorsel: m02-04-a
        karakter: kemal
        alt: Avukat Kemal arka sokakta mühürlü zarfı satmayı teklif ediyor; arka planda resmî bildirim kutusu parlıyor
        prompt: "A dark back alley at night: the villain holds out a sealed envelope with a tempting smile toward the viewer, as if offering to sell it. In the background at the end of the alley, a lit official secure mailbox with a small shield symbol glows invitingly."
        anlatici: Arka sokak. Kemal bir zarf uzatıyor; ilerideki resmî bildirim kutusu parlıyor.
        balonlar:
          - kim: Kemal
            metin: Bu açığı satarsan zengin olursun. Bildirirsen? Hiçbir şey.
            tur: konusma
            yer: sol-ust
            en: Sell this flaw and you get rich. Report it? Nothing.
          - kim: Tilki
            metin: Dur, doğru kanalı bul, kısa yaz, süre tanı.
            tur: dusunce
            yer: sag-alt
            en: Stop, find the right channel, write it short, give them time.
        en:
          alt: Lawyer Kemal offers a sealed envelope for sale in a back street while an official reporting box glows in the background
          anlatici: A back street. Kemal holds out an envelope; ahead, the official reporting box glows.
    en:
      baslik: The back-street offer
  m02-05-sahne:
    baslik: Üç kalkan
    paneller:
      - gorsel: m02-05-a
        karakter: kemal
        alt: Avukat Kemal üç parlayan kalkanın arasına levye sokmaya çalışıyor
        prompt: Three overlapping translucent shields in shades of green and blue protect a soft glowing cloud of tiny data particles. The villain wedges a crowbar between two shields with great effort, his briefcase dropped at his feet, sweating.
        anlatici: "Üç kalkan: KKTC, Türkiye, AB. Kemal aralarına levye sokmaya çalışıyor."
        balonlar:
          - kim: Kemal
            metin: Bir yasa açık bırakırsa, öbürü de bırakır.
            tur: konusma
            yer: sol-ust
            en: If one law leaves a gap, so does the next.
          - kim: Tilki
            metin: Beş ilke üçünde de aynı. Boşluk yok.
            tur: dusunce
            yer: sag-alt
            en: The five principles are the same in all three. No gap.
        ses:
          metin: GICIRT!
          yer: sag-ust
        en:
          alt: Lawyer Kemal tries to wedge a crowbar between three glowing shields
          anlatici: "Three shields: the TRNC, Türkiye, the EU. Kemal tries to wedge a crowbar between them."
          ses: CREAK!
    en:
      baslik: Three shields
  m02-06-sahne:
    baslik: Dipnotlar
    paneller:
      - gorsel: m02-06-a
        karakter: kemal
        alt: Avukat Kemal, dipnotları parlayan bir sözleşmeyi ve tüy kalemi masada uzatıyor
        prompt: A heavy desk under a green banker's lamp. The villain slides a contract across the table toward the viewer, offering a glowing quill pen with a sly smile; at the bottom of the page, tiny abstract fine-print lines glow suspiciously red.
        anlatici: Kemal masaya bir sözleşme koyuyor; dipnotları kendi kendine parlıyor.
        balonlar:
          - kim: Kemal
            metin: İmzala, gerisini dert etme.
            tur: konusma
            yer: sol-ust
            en: Sign it, don't worry about the rest.
          - kim: Tilki
            metin: Önce dipnotları okurum.
            tur: dusunce
            yer: sag-alt
            en: I read the footnotes first.
        en:
          alt: Lawyer Kemal pushes a contract with glowing footnotes and a quill across the table
          anlatici: Kemal puts a contract on the table; its footnotes glow on their own.
    en:
      baslik: Footnotes
  m03-01-sahne:
    baslik: Katmanlı pasta
    paneller:
      - gorsel: m03-01-a
        karakter: riza
        alt: Katmanlı pasta gibi kesilmiş bir laptopun orta katmanına Anahtarcı Rıza gizlice bir anahtar sokuyor
        prompt: "A laptop drawn as a sliced layered cake seen from the side: a bottom layer of chips and circuit boards, a glowing middle layer with tiny gears, a top layer decorated with floating app tiles. The villain sneaks in from the side, slipping a glowing key into the middle layer."
        anlatici: "Laptop bir pasta gibi kesilmiş: donanım, işletim sistemi, uygulamalar… ve en üstte sen."
        balonlar:
          - kim: Rıza
            metin: Ben hep ortadan girerim. Kimse ortaya bakmaz.
            tur: konusma
            yer: sol-ust
            en: I always go in through the middle. Nobody looks at the middle.
          - kim: Tilki
            metin: Uzantıyı göster, dosyanın gerçek adını gör.
            tur: dusunce
            yer: sag-alt
            en: Show the extension, see the file's real name.
        en:
          alt: Locksmith Rıza secretly slips a key into the middle layer of a laptop sliced like a layer cake
          anlatici: "The laptop is sliced like a cake: hardware, operating system, applications… and you on top."
    en:
      baslik: The layer cake
  m03-02-sahne:
    baslik: Ana anahtar
    paneller:
      - gorsel: m03-02-a
        karakter: riza
        alt: Anahtarcı Rıza koridordaki kilitli dolapta duran ana anahtarı maymuncukla almaya çalışıyor
        prompt: A dim hallway with many doors; on the wall a locked glass cabinet holds one large glowing master key. The villain crouches in front of it working a lockpick into the cabinet lock, his huge keyring jingling, eyes fixed on the prize.
        anlatici: Koridorda kilitli bir dolap. İçinde her kapıyı açan ana anahtar.
        balonlar:
          - kim: Rıza
            metin: Yönetici hesabıyla gezen biri… benim en sevdiğim insan.
            tur: konusma
            yer: sol-ust
            en: Someone who walks around with an admin account… my favourite kind of person.
          - kim: Tilki
            metin: Günlük işler standart hesapla. En az yetki.
            tur: dusunce
            yer: sag-alt
            en: Everyday work with a standard account. Least privilege.
        ses:
          metin: KLİK!
          yer: sag-ust
        en:
          alt: Locksmith Rıza tries to pick the master key out of a locked cupboard in the corridor
          anlatici: A locked cupboard in the corridor. Inside, the master key that opens every door.
          ses: CLICK!
    en:
      baslik: The master key
  m03-03-sahne:
    baslik: Robot kılığı
    paneller:
      - gorsel: m03-03-a
        karakter: riza
        alt: Anahtarcı Rıza, fabrika bandındaki küçük robotların arasında takma bıyıkla robot kılığına girmiş
        prompt: A tidy factory conveyor line where tiny helper robots each carry a glowing box. At the end of the line, the villain crouches inside a cardboard robot costume with an obviously fake mustache, trying to blend in, his keyring poking out.
        anlatici: Fabrika bandı. Robotlar çalışıyor; birinin bıyığı takma.
        balonlar:
          - kim: Rıza
            metin: Bip bop. Ben de sizdenim. Bip.
            tur: konusma
            yer: sol-ust
            en: Beep boop. I'm one of you. Beep.
          - kim: Tilki
            metin: Başlangıçta açılan şu yeni program ne?
            tur: dusunce
            yer: sag-alt
            en: What's this new program that starts at boot?
        en:
          alt: Locksmith Rıza, wearing a fake moustache, blends in among the small robots on a factory conveyor
          anlatici: The factory conveyor. Robots are working; one of them has a fake moustache.
    en:
      baslik: Dressed as a robot
  m03-04-sahne:
    baslik: Kırılan anahtar
    paneller:
      - gorsel: m03-04-b
        karakter: riza
        alt: Anahtarcı Rıza yeni güncellenmiş kapıda anahtarını deniyor; parlayan kalkan yaması kilidi kapatmış, anahtar kırılıyor
        prompt: A freshly repainted door in a dark corridor glows with a translucent shield patch sealing its keyhole. The villain jams a key from his giant keyring into it and the key snaps in half; he stares at the broken key in disbelief while a small guard robot with a shield badge watches from the side.
        anlatici: Rıza'nın anahtarı dün açtığı kapıda. Ama gece bir güncelleme gelmiş.
        balonlar:
          - kim: Rıza
            metin: Dün açılıyordu! Kim yamadı bunu?!
            tur: konusma
            yer: sol-ust
            en: It opened yesterday! Who patched this?!
          - kim: Tilki
            metin: Güncelleme bilinen kapıları kapatır.
            tur: dusunce
            yer: sag-alt
            en: An update closes the doors that are known.
        ses:
          metin: KRAK!
          yer: sag-ust
        en:
          alt: Locksmith Rıza tries his key on the newly patched door; a glowing shield patch has sealed the lock and the key snaps
          anlatici: Rıza's key, on the door it opened yesterday. But an update came overnight.
          ses: SNAP!
    en:
      baslik: The broken key
  m03-05-sahne:
    baslik: Cam fanus
    paneller:
      - gorsel: m03-05-a
        karakter: riza
        alt: Anahtarcı Rıza bir kar küresi gibi cam fanusun içinde mahsur kalmış, camı yumrukluyor
        prompt: A laptop on a desk with three small glass snow-globe domes floating above its screen, each containing a tiny separate computer. Inside one dome, a miniature version of the villain is trapped, pounding on the glass and shouting, while the glass contains him completely.
        anlatici: Rıza bir sanal makinenin içinde. Etrafı cam; dışarı çıkamıyor.
        balonlar:
          - kim: Rıza
            metin: Burası gerçek bilgisayar değil mi?!
            tur: konusma
            yer: sol-ust
            en: This isn't a real computer?!
          - kim: Tilki
            metin: Riskli işi sanal makinede yap, yedeği bağlantısız tut.
            tur: dusunce
            yer: sag-alt
            en: Do risky work in a virtual machine, keep the backup offline.
        ses:
          metin: TOK TOK!
          yer: sag-ust
        en:
          alt: Locksmith Rıza trapped inside a glass dome like a snow globe, pounding on the glass
          anlatici: Rıza is inside a virtual machine. Glass all around; he can't get out.
          ses: THUMP THUMP!
    en:
      baslik: The glass dome
  m03-06-sahne:
    baslik: Muayene masası
    paneller:
      - gorsel: m03-06-a
        karakter: riza
        alt: Muayene masasındaki laptopa Anahtarcı Rıza'nın eldivenli eli masanın altından uzanıyor
        prompt: A laptop lies on a small clinic examination table under a white sheet. From under the table, the villain's gloved hand creeps up toward the laptop holding a key, while a clipboard with abstract checkmarks lies nearby.
        anlatici: Laptop muayene masasında. Masanın altından eldivenli bir el uzanıyor.
        balonlar:
          - kim: Rıza
            metin: Kontrol listesi mi? Ben listede yokum ki.
            tur: fisilti
            yer: sol-ust
            en: A checklist? I'm not on the list.
          - kim: Tilki
            metin: Hesaplar, güncelleme, şifreleme, yedek. Sırayla.
            tur: dusunce
            yer: sag-alt
            en: Accounts, updates, encryption, backups. One at a time.
        en:
          alt: A gloved hand from beneath the examination table reaches up towards the laptop on it
          anlatici: The laptop is on the examination table. A gloved hand reaches up from underneath.
    en:
      baslik: The examination table
  m04-01-sahne:
    baslik: Sunucu tahtı
    paneller:
      - gorsel: m04-01-a
        karakter: sadri
        alt: Süper Kullanıcı Sadri sunucu tahtında, önünde yeşil parlayan dev bir terminal penceresi
        prompt: "A dark server room: the villain sprawls on his throne of server racks, and in front of him floats a huge dark terminal window emitting a soft green glow, filled with abstract glowing lines and a blinking block cursor (no readable characters). His monocle reflects the screen."
        anlatici: Eski veri merkezi. Yaşlı bir adam sunucudan bir tahtta oturuyor.
        balonlar:
          - kim: Sadri
            metin: Terminal benim krallığım, evlat. Komut ver, itaat etsin.
            tur: konusma
            yer: sol-ust
            en: The terminal is my kingdom, son. Give a command and it obeys.
          - kim: Tilki
            metin: Önce whoami. Kim olduğumu bileyim.
            tur: dusunce
            yer: sag-alt
            en: First whoami. Let me know who I am.
        en:
          alt: Superuser Sadri on a throne of servers, a giant green-glowing terminal window in front of him
          anlatici: An old data centre. An old man sits on a throne made of servers.
    en:
      baslik: The server throne
  m04-02-sahne:
    baslik: Ters ağaç
    paneller:
      - gorsel: m04-02-a
        karakter: sadri
        alt: Ters dönmüş klasör ağacının kökünde oturan Süper Kullanıcı Sadri elinde budama makasıyla
        prompt: An upside-down glowing tree hanging from the ceiling of a cavern, its branches ending in small folder-shaped leaves. The villain sits at the very root at the top like a king, holding a pair of pruning shears and eyeing the folders below.
        anlatici: Ters dönmüş bir dosya ağacı. Kökünde, elinde budama makasıyla Sadri.
        balonlar:
          - kim: Sadri
            metin: /etc'den bir dal, /var/log'dan bir dal… kim fark eder?
            tur: konusma
            yer: sol-ust
            en: A branch from /etc, a branch from /var/log… who'll notice?
          - kim: Tilki
            metin: Olay incelemesinin ilk durağı /var/log.
            tur: dusunce
            yer: sag-alt
            en: The first stop in incident response is /var/log.
        ses:
          metin: ÇIT!
          yer: sag-ust
        en:
          alt: Superuser Sadri sitting at the root of an upside-down folder tree with pruning shears in his hand
          anlatici: An upside-down file tree. At its root, Sadri, pruning shears in hand.
          ses: SNIP!
    en:
      baslik: The upside-down tree
  m04-03-sahne:
    baslik: Samanlıkta iğne
    paneller:
      - gorsel: m04-03-a
        karakter: sadri
        alt: Süper Kullanıcı Sadri altın ipliklerden bir samanlığın içine parlayan bir iğne saklıyor
        prompt: A tall haystack made of countless thin glowing golden threads in a dark barn. The villain, chuckling, pushes a single bright green needle deep into the haystack, confident no one will ever find it.
        anlatici: Sadri altın bir samanlığa tek bir parlayan iğne saklıyor.
        balonlar:
          - kim: Sadri
            metin: Milyon satır log. Bul bakalım.
            tur: konusma
            yer: sol-ust
            en: Millions of log lines. Find it.
          - kim: Tilki
            metin: grep "Failed" | sort | uniq -c. Buldum.
            tur: dusunce
            yer: sag-alt
            en: grep "Failed" | sort | uniq -c. Found it.
        en:
          alt: Superuser Sadri hides a glowing needle inside a haystack made of golden threads
          anlatici: Sadri hides a single glowing needle in a golden haystack.
    en:
      baslik: A needle in a haystack
  m04-04-sahne:
    baslik: "777"
    paneller:
      - gorsel: m04-04-a
        karakter: sadri
        alt: Süper Kullanıcı Sadri okuma, yazma, çalıştırma kilitli üç kapıyı ardına kadar açıp kahkaha atıyor
        prompt: A room with three side-by-side doors (gold, silver, bronze), each fitted with three small lock icons shaped like an eye, a pencil and a play button. The villain flings all three doors wide open at once, every lock glowing open, laughing with his arms spread.
        anlatici: Okuma, yazma, çalıştırma. Üç kilitli kapı. Sadri hepsini ardına kadar açıyor.
        balonlar:
          - kim: Sadri
            metin: chmod 777! Herkese her şey! Ha ha!
            tur: konusma
            yer: sol-ust
            en: chmod 777! Everything to everyone! Ha ha!
          - kim: Tilki
            metin: Herkese her yetki = herkese her açık.
            tur: dusunce
            yer: sag-alt
            en: Every permission for everyone = every flaw for everyone.
        ses:
          metin: BAM!
          yer: sag-ust
        en:
          alt: Superuser Sadri flings open three locked doors marked read, write and execute, laughing
          anlatici: Read, write, execute. Three locked doors. Sadri throws them all wide open.
          ses: BAM!
    en:
      baslik: "777"
  m04-05-sahne:
    baslik: Mührü kırık kutu
    paneller:
      - gorsel: m04-05-a
        karakter: sadri
        alt: Paket deposunda Süper Kullanıcı Sadri mühürü kırık şüpheli bir kutuyu güler yüzle uzatıyor
        prompt: An orderly delivery depot with shelves of identical boxes sealed with green wax seals. The villain holds out one box with a broken seal and a suspicious green glow leaking out, offering it with an exaggerated friendly smile.
        anlatici: Paket deposu. Sadri gülümseyerek mührü kırık bir kutu uzatıyor.
        balonlar:
          - kim: Sadri
            metin: curl | bash. Okumaya ne gerek var?
            tur: konusma
            yer: sol-ust
            en: curl | bash. Who needs to read it?
          - kim: Tilki
            metin: Okumadığım komutu çalıştırmam.
            tur: dusunce
            yer: sag-alt
            en: I don't run a command I haven't read.
        en:
          alt: In a parcel depot, Superuser Sadri smilingly hands over a suspicious box with a broken seal
          anlatici: A parcel depot. Smiling, Sadri holds out a box with a broken seal.
    en:
      baslik: The box with the broken seal
  m04-06-sahne:
    baslik: Arşivin sonu
    paneller:
      - gorsel: m04-06-a
        karakter: sadri
        alt: Karanlık arşiv koridorunun sonunda fenerli Süper Kullanıcı Sadri gizli bir kutunun yanında bekliyor
        prompt: A long dark archive corridor lined with shelves of folder boxes, a single flashlight beam cutting through the dark from the viewer's side. At the far end, the villain's silhouette waits beside one faintly glowing box, his monocle gleaming green.
        anlatici: Karanlık arşiv koridoru. En sonda fenerli biri, gizli bir kutunun yanında.
        balonlar:
          - kim: Sadri
            metin: Gizli dosyayı bulursan, bir sonraki kapıyı da bulursun.
            tur: konusma
            yer: sol-ust
            en: Find the hidden file and you'll find the next door too.
          - kim: Tilki
            metin: find / -name ".*" 2>/dev/null
            tur: dusunce
            yer: sag-alt
            en: find / -name ".*" 2>/dev/null
        en:
          alt: At the end of a dark archive corridor, Superuser Sadri waits with a torch beside a hidden box
          anlatici: A dark archive corridor. At the far end, someone with a torch, beside a hidden box.
    en:
      baslik: The end of the archive
  m05-01-sahne:
    baslik: Kavşağın altında
    paneller:
      - gorsel: m05-01-a
        karakter: nuri
        alt: Ev ağının kavşağı olarak çizilmiş router'ın altına sinmiş Dinleyici Nuri kabloya kulak veriyor
        prompt: An isometric miniature neighborhood where tiny houses represent devices (phone, laptop, game console), connected by little streets to a central roundabout representing the router, with a glowing highway leading off to a distant city skyline. Underneath the roundabout, the villain crouches in a drain tunnel, tapping a cable with his headphones on.
        anlatici: "Yurt ağının kavşağı: router. Altındaki kanalda kulaklıklı biri kabloya yapışmış."
        balonlar:
          - kim: Nuri
            metin: Her paket bu kavşaktan geçer. Ben de burada beklerim.
            tur: fisilti
            yer: sol-ust
            en: Every packet passes this junction. So I wait here.
          - kim: Tilki
            metin: LAN evin içi, WAN dışarısı. Kavşak da router.
            tur: dusunce
            yer: sag-alt
            en: LAN is inside the house, WAN is outside. And the junction is the router.
        en:
          alt: Listener Nuri crouched beneath the router drawn as the junction of the home network, listening to the cable
          anlatici: "The junction of the dorm network: the router. In the duct below, someone in headphones clings to a cable."
    en:
      baslik: Beneath the junction
  m05-02-sahne:
    baslik: Zarfın içinde zarf
    paneller:
      - gorsel: m05-02-a
        karakter: nuri
        alt: Dinleyici Nuri iç içe zarfların en dıştakini çaydanlık buharıyla açmaya çalışıyor
        prompt: Four nested envelopes of different colors drawn slightly exploded on a desk, a small folded note with abstract scribbles at the center. The villain holds the outermost envelope over the steam of a whistling kettle, trying to peel it open without being noticed.
        anlatici: Nuri'nin mutfağı. Çaydanlık fokurduyor; elinde iç içe geçmiş zarflar.
        balonlar:
          - kim: Nuri
            metin: Dış zarfı açarsam içtekini de okurum…
            tur: konusma
            yer: sol-ust
            en: If I open the outer envelope, I read the one inside too…
          - kim: Tilki
            metin: Her katman kendi başlığını ekler. Açması kolay, okuması değil.
            tur: dusunce
            yer: sag-alt
            en: Each layer adds its own header. Easy to open, not to read.
        ses:
          metin: FOKUR!
          yer: sag-ust
        en:
          alt: Listener Nuri tries to open the outermost of several nested envelopes with steam from a kettle
          anlatici: Nuri's kitchen. The kettle is bubbling; in his hands, nested envelopes.
          ses: GLUG!
    en:
      baslik: An envelope inside an envelope
  m05-03-sahne:
    baslik: Sahte isim levhası
    paneller:
      - gorsel: m05-03-a
        karakter: nuri
        alt: Dinleyici Nuri apartman kapısındaki isim levhasını kendi levhasıyla değiştiriyor
        prompt: A Mediterranean apartment building at night with a glowing street plaque on the main entrance and blank nameplates on each door. The villain stands on tiptoe swapping one door's nameplate for his own blank plate, a screwdriver in his teeth.
        anlatici: Gece, apartman girişi. Nuri bir kapının isim levhasını kendi levhasıyla değiştiriyor.
        balonlar:
          - kim: Nuri
            metin: Postacı adrese bakar, yüze bakmaz.
            tur: fisilti
            yer: sol-ust
            en: The postman looks at the address, not the face.
          - kim: Tilki
            metin: IP adres, MAC kimlik. İkisi birden tutmuyorsa biri yalan söylüyor.
            tur: dusunce
            yer: sag-alt
            en: IP address, MAC identity. If the two don't match, one of them is lying.
        en:
          alt: Listener Nuri swaps the nameplate on an apartment door for his own
          anlatici: Night, an apartment entrance. Nuri swaps a door's nameplate for his own.
    en:
      baslik: The fake nameplate
  m05-04-sahne:
    baslik: 65.535 kapı
    paneller:
      - gorsel: m05-04-a
        karakter: nuri
        alt: Numaralı kapıları olan bir binanın önünde Dinleyici Nuri kulağını bir kapıya dayamış dinliyor
        prompt: A long futuristic building facade with dozens of small doors, each with a different abstract symbol, most closed and dark, a few open with warm light. The villain presses his ear and his parabolic dish against one closed door, listening intently.
        anlatici: Numaralı kapılarla dolu bir bina. Nuri kulağını 23 numaraya dayamış.
        balonlar:
          - kim: Nuri
            metin: Telnet hâlâ açık! Şifreler düz metin geçiyor!
            tur: fisilti
            yer: sol-ust
            en: Telnet is still open! Passwords are going through in plain text!
          - kim: Tilki
            metin: TCP el sıkışır, UDP sıkışmaz. Gereksiz kapı kapalı kalır.
            tur: dusunce
            yer: sag-alt
            en: TCP shakes hands, UDP never does. A door you don't need stays shut.
        ses:
          metin: TIK TIK!
          yer: sag-ust
        en:
          alt: Listener Nuri presses his ear to one numbered door in a building full of numbered doors
          anlatici: A building full of numbered doors. Nuri has his ear pressed to number 23.
          ses: KNOCK KNOCK!
    en:
      baslik: 65,535 Doors
  m05-05-sahne:
    baslik: Yanlış adres
    paneller:
      - gorsel: m05-05-a
        karakter: nuri
        alt: Dinleyici Nuri, rehber kitaplı yardımcı robotun kulağına yanlış adres fısıldıyor
        prompt: "Four tiny helper robots stand in a row in a server hallway, each with a prop: a big address book, glowing key tags, a cupped hand calling out, an ear trumpet. The villain leans in and whispers into the ear of the address-book robot, pointing it the wrong way."
        anlatici: Rehber kitaplı yardımcı robot DNS'i yönetiyor. Nuri kulağına eğilmiş.
        balonlar:
          - kim: Nuri
            metin: kampus.edu mu? O artık benim adresim.
            tur: fisilti
            yer: sol-ust
            en: kampus.edu? That's my address now.
          - kim: Tilki
            metin: DNS ad bulur, DHCP adres dağıtır, ARP kapıyı bulur. Hepsi kandırılabilir.
            tur: dusunce
            yer: sag-alt
            en: DNS finds names, DHCP hands out addresses, ARP finds the door. All of them can be fooled.
        en:
          alt: Listener Nuri whispers a wrong address into the ear of a book-carrying guide robot
          anlatici: A book-carrying helper robot runs DNS. Nuri leans in to its ear.
    en:
      baslik: Wrong Address
  m05-06-sahne:
    baslik: Sadece parazit
    paneller:
      - gorsel: m05-06-b
        karakter: nuri
        alt: Dinleyici Nuri kabloyu dinliyor ama içinden geçen paketler kilitli kapsüllerde; kulaklığından yalnızca parazit geliyor
        prompt: The villain clamps his headphones to a glowing cable, but every packet sliding through it is sealed inside a small glowing capsule with a padlock. Only static squiggles come out of his headphones and he scowls in frustration.
        anlatici: Nuri kabloyu dinliyor. Ama paketler artık kilitli kapsüllerde geçiyor.
        balonlar:
          - kim: Nuri
            metin: Hışırtı… sadece hışırtı! Kim kilitledi bunu?!
            tur: konusma
            yer: sol-ust
            en: Static… just static! Who locked this?!
          - kim: Tilki
            metin: "HTTPS'deki kilit: içerik şifreli. Ama sitenin kim olduğuna yine bak."
            tur: dusunce
            yer: sag-alt
            en: "The padlock in HTTPS: the content is encrypted. But still check who owns the site."
        ses:
          metin: CIZZZ!
          yer: sag-ust
        en:
          alt: Listener Nuri listens to a cable, but the packets passing through are locked capsules; only static reaches his headphones
          anlatici: Nuri listens to the cable. But the packets now travel in locked capsules.
          ses: HSSSS!
    en:
      baslik: Just Static
  m05-07-sahne:
    baslik: Tezgâhın altı
    paneller:
      - gorsel: m05-07-a
        karakter: nuri
        alt: Teşhis aletleriyle dolu açık çantanın yanında tezgâhın altına gizlenmiş yanıp sönen dinleme cihazı
        prompt: An open vintage leather tool bag on a workbench holding a stethoscope, a magnifying glass, a folded map, a compass and a small radar dish. Under the bench, the villain is caught mid-motion sticking a small blinking listening bug to the underside of the table.
        anlatici: "Teşhis çantası açık: ping, traceroute, ip, ss. Tezgâhın altında bir şey yanıp sönüyor."
        balonlar:
          - kim: Nuri
            metin: Onlar bağlantıyı test ederken ben onları test ederim.
            tur: fisilti
            yer: sol-ust
            en: They test the connection while I test them.
          - kim: Tilki
            metin: "ss -tunap: kim kime bağlı, hepsi listede."
            tur: dusunce
            yer: sag-alt
            en: "ss -tunap: who is connected to whom, all of it in the list."
        ses:
          metin: BİP… BİP…
          yer: sag-ust
        en:
          alt: A blinking listening device hidden under a counter beside an open bag of diagnostic tools
          anlatici: "The diagnostic bag is open: ping, traceroute, ip, ss. Something under the counter is blinking."
          ses: BEEP… BEEP…
    en:
      baslik: Under the Counter
  m05-08-sahne:
    baslik: Köprüdeki dürbün
    paneller:
      - gorsel: m05-08-b
        karakter: nuri
        alt: Dinleyici Nuri paket otoyolunun üzerindeki köprüde dürbünle trafiği izliyor
        prompt: A pedestrian bridge over a busy glowing highway at night where vehicles are small glowing packets of different colors moving in lanes. The villain leans on the railing with binoculars and his headphones, scribbling notes about certain packets in a small notebook.
        anlatici: Paket otoyolu. Üstündeki köprüde dürbünlü bir adam.
        balonlar:
          - kim: Nuri
            metin: Her araba bir paket. Plakalarını tek tek yazıyorum.
            tur: konusma
            yer: sol-ust
            en: Every car is a packet. I write down their plates one by one.
          - kim: Tilki
            metin: Wireshark'ı ben de açarım. Ama sadece kendi ağımda.
            tur: dusunce
            yer: sag-alt
            en: I open Wireshark too. But only on my own network.
        en:
          alt: Listener Nuri watches traffic with binoculars from a bridge over a packet highway
          anlatici: The packet highway. On the bridge above it, a man with binoculars.
    en:
      baslik: Binoculars on the Bridge
  m05-09-sahne:
    baslik: Gazetedeki delik
    paneller:
      - gorsel: m05-09-b
        karakter: nuri
        alt: Fırın-kafede gazetesindeki delikten bakan Dinleyici Nuri; öğrencinin laptopunun üstünde bir sitenin açılma adımları parlıyor
        prompt: "A cozy bakery café at night: the villain hides behind a newspaper with a hole cut out for his eyes, peeking at a student's laptop at the next table. Above the laptop floats a translucent chain of glowing steps: an address book, a handshake, a padlock and a delivered envelope."
        anlatici: Fırın-kafe. Biri gazetesinin ortasındaki delikten bir laptopa bakıyor.
        balonlar:
          - kim: Nuri
            metin: DNS, TCP, TLS, HTTP… her adımı biliyorum.
            tur: fisilti
            yer: sol-ust
            en: DNS, TCP, TLS, HTTP… I know every step.
          - kim: Tilki
            metin: Ben de biliyorum. Bu yüzden ortak Wi-Fi'de VPN açığım.
            tur: dusunce
            yer: sag-alt
            en: So do I. That's why I run a VPN on public Wi-Fi.
        en:
          alt: Listener Nuri peering through a hole in his newspaper in a bakery-café while the steps of a site loading glow above a student's laptop
          anlatici: A bakery-café. Someone is watching a laptop through a hole in the middle of his newspaper.
    en:
      baslik: The Hole in the Newspaper
  m06-01-sahne:
    baslik: Değişen fiş
    paneller:
      - gorsel: m06-01-a
        karakter: celal
        alt: Restoran mutfağında Çerezci Celal müşterinin sipariş fişini gizlice değiştiriyor
        prompt: "A cozy restaurant cutaway: on the left a customer at a table hands an order slip to a waiter, in the middle a swinging kitchen door, on the right a kitchen with a pantry of jars. Inside the kitchen, the villain intercepts the order slip and swaps it for his own, grinning under his chef hat."
        anlatici: Restoran mutfağı. Garson siparişi bırakıyor; Celal fişi gizlice değiştiriyor.
        balonlar:
          - kim: Celal
            metin: Müşteri çorba istedi. Ama mutfak benim istediğimi pişirir.
            tur: konusma
            yer: sol-ust
            en: The customer asked for soup. But the kitchen cooks what I want.
          - kim: Tilki
            metin: Tarayıcı istek yollar, sunucu cevap verir. Arada kimse fişe dokunmamalı.
            tur: dusunce
            yer: sag-alt
            en: The browser sends a request, the server replies. Nobody in between should touch the ticket.
        en:
          alt: In a restaurant kitchen, Cookie-Baker Celal secretly swaps a customer's order ticket
          anlatici: A restaurant kitchen. The waiter leaves the order; Celal secretly swaps the ticket.
    en:
      baslik: The Swapped Ticket
  m06-02-sahne:
    baslik: Servis penceresi
    paneller:
      - gorsel: m06-02-b
        karakter: celal
        alt: Fırının servis penceresinden sipariş fişleri girip paketler çıkıyor; Çerezci Celal fişleri gizlice okuyor
        prompt: "A bakery service hatch: an order slip slides in through the window from a customer's hand and a tray with a neatly wrapped package slides back out. The villain stands at the hatch secretly reading each slip as it passes, a cookie tucked behind his ear."
        anlatici: Fırının servis penceresi. Fişler giriyor, paketler çıkıyor. Celal her fişi okuyor.
        balonlar:
          - kim: Celal
            metin: GET, POST… hepsi açık açık yazıyor. Ne güzel.
            tur: fisilti
            yer: sol-ust
            en: GET, POST… all written out in the open. Lovely.
          - kim: Tilki
            metin: "Durum kodları dili anlatır: 200 tamam, 404 yok, 500 sunucu çöktü."
            tur: dusunce
            yer: sag-alt
            en: "Status codes tell the story: 200 OK, 404 missing, 500 the server crashed."
        en:
          alt: Order tickets go in and parcels come out through a bakery's service window while Cookie-Baker Celal secretly reads the tickets
          anlatici: The bakery's service window. Tickets go in, parcels come out. Celal reads every ticket.
    en:
      baslik: The Service Window
  m06-03-sahne:
    baslik: Perde arkası
    paneller:
      - gorsel: m06-03-a
        karakter: celal
        alt: Tiyatronun perde arkasında Çerezci Celal servis penceresinden sızıp kontrol paneline uzanıyor
        prompt: "A theater cutaway: a bright front stage with colorful set pieces, behind the curtain a backstage full of ropes, gears and a control panel, and below a basement archive of boxes. The villain climbs through the small service window between stage and backstage, reaching for the control levers."
        anlatici: Tiyatro. Sahnede ön yüz, perdenin arkasında asıl makine. Celal kontrol paneline uzanıyor.
        balonlar:
          - kim: Celal
            metin: Seyirci sahneyi izler. Ben perdeyi.
            tur: konusma
            yer: sol-ust
            en: The audience watches the stage. I watch the curtain.
          - kim: Tilki
            metin: API kapısını sadece ön yüz kullanır sanma. Herkes çalabilir.
            tur: dusunce
            yer: sag-alt
            en: Don't think only the front end uses the API door. Anyone can steal through it.
        ses:
          metin: GICIRT!
          yer: sag-ust
        en:
          alt: Backstage at a theatre, Cookie-Baker Celal slips in through the service window and reaches for the control panel
          anlatici: A theatre. The front end is on stage; the real machine is behind the curtain. Celal reaches for the control panel.
          ses: CREAK!
    en:
      baslik: Behind the Curtain
  m06-04-sahne:
    baslik: Çalıntı bileklik
    paneller:
      - gorsel: m06-04-b
        karakter: celal
        alt: Çerezci Celal çaldığı parlayan bileklikle kulüp kapısından geçmeye çalışıyor; kapıdaki robot görevli listeyi kontrol ediyor
        prompt: A velvet-rope doorway of a noir club where a sturdy bouncer robot checks glowing cookie-shaped wristbands against a clipboard. The villain holds up a borrowed wristband with an innocent smile, but the robot raises one hand to stop him while comparing his face to the list.
        anlatici: Kulüp kapısı. Celal parlayan bir bileklikle sıraya girmiş. Robot görevli listeye bakıyor.
        balonlar:
          - kim: Celal
            metin: Bileklik bende, demek ki ben oyum.
            tur: konusma
            yer: sol-ust
            en: I've got the wristband, so I'm whoever they are.
          - kim: Tilki
            metin: Oturum çerezi bir kimlik kartıdır. HttpOnly, Secure, kısa ömür.
            tur: dusunce
            yer: sag-alt
            en: A session cookie is an ID card. HttpOnly, Secure, short-lived.
        ses:
          metin: BİİP!
          yer: sag-ust
        en:
          alt: Cookie-Baker Celal tries to pass through the club door with a stolen glowing wristband while the robot attendant checks the list
          anlatici: The club door. Celal queues with a glowing wristband. The robot attendant checks the list.
          ses: BEEP!
    en:
      baslik: The Stolen Wristband
  m06-05-sahne:
    baslik: Dünya depoları
    paneller:
      - gorsel: m06-05-a
        karakter: celal
        alt: Dünya üzerindeki CDN depolarından birinde Çerezci Celal çaldığı çerezleri bir teslimat dronuna yüklüyor
        prompt: A stylized dark globe with many small glowing warehouse buildings on different continents sending light trails to nearby cities. On the roof of one warehouse, the villain loads a tray of swiped glowing cookies onto a small delivery drone, looking around furtively.
        anlatici: Bir CDN deposu. Celal çaldığı çerezleri bir teslimat dronuna yüklüyor.
        balonlar:
          - kim: Celal
            metin: Sunucu her yerde. Ben de her yerdeyim.
            tur: konusma
            yer: sol-ust
            en: The server is everywhere. So am I.
          - kim: Tilki
            metin: Bulutta yanlış ayarlanmış bir kova, kilitsiz bir depo demek.
            tur: dusunce
            yer: sag-alt
            en: A misconfigured bucket in the cloud means an unlocked warehouse.
        ses:
          metin: VIIIN!
          yer: sag-ust
        en:
          alt: At one of the CDN warehouses around the world, Cookie-Baker Celal loads stolen cookies onto a delivery drone
          anlatici: A CDN warehouse. Celal loads stolen cookies onto a delivery drone.
          ses: WHIRR!
    en:
      baslik: World of Warehouses
  m06-06-sahne:
    baslik: Büyüteçli misafir
    paneller:
      - gorsel: m06-06-b
        karakter: celal
        alt: Odaları açılmış dev tarayıcı evinde Çerezci Celal çerez kavanozuna uzanıyor; dışarıdan bir öğrenci büyüteçle izliyor
        prompt: "A giant web browser drawn as an open dollhouse with rooms: a network room full of flying envelopes, a storage room with a big glass cookie jar, and a console room with a glowing terminal. The villain tiptoes into the storage room reaching for the cookie jar, while outside a student with a magnifying glass inspects every room."
        anlatici: Odaları açılmış dev bir tarayıcı evi. Celal çerez kavanozuna uzanıyor. Pencerede bir büyüteç.
        balonlar:
          - kim: Celal
            metin: Kimse geliştirici araçlarını açmaz…
            tur: konusma
            yer: sol-ust
            en: Nobody opens developer tools…
          - kim: Tilki
            metin: F12. Ağ sekmesi. Uygulama sekmesi. Seni görüyorum.
            tur: dusunce
            yer: sag-alt
            en: F12. Network tab. Application tab. I can see you.
        en:
          alt: In a giant browser house with its rooms opened up, Cookie-Baker Celal reaches for the cookie jar while a student outside watches through a magnifying glass
          anlatici: A giant browser house with its rooms opened up. Celal reaches for the cookie jar. At the window, a magnifying glass.
    en:
      baslik: The Guest with the Magnifying Glass
  m07-01-sahne:
    baslik: İpli robot kolu
    paneller:
      - gorsel: m07-01-a
        karakter: orhan
        alt: Fütüristik mutfakta Kuklacı Orhan robot kolu ipleriyle yönetip tarife yabancı bir malzeme ekletiyor
        prompt: A small futuristic kitchen where a friendly robot arm follows a recipe card covered only with simple abstract shapes and dots. From above, the villain controls the robot arm with glowing marionette strings, making it pour a suspicious glowing green ingredient into the pot.
        anlatici: Fütüristik mutfak. Robot kol yemek yapıyor; kolun iplerini Orhan tutuyor.
        balonlar:
          - kim: Orhan
            metin: Tarife bir satır eklerim. Robot sorgulamaz.
            tur: konusma
            yer: sol-ust
            en: I add one line to the recipe. The robot doesn't question it.
          - kim: Tilki
            metin: Kodu okuyabilen, iplerin nereye bağlı olduğunu görür.
            tur: dusunce
            yer: sag-alt
            en: Whoever can read the code sees where the strings are tied.
        en:
          alt: In a futuristic kitchen, Puppeteer Orhan controls a robot arm with strings and makes it add a foreign ingredient to the recipe
          anlatici: A futuristic kitchen. A robot arm is cooking; Orhan holds the arm's strings.
    en:
      baslik: The Puppet Robot Arm
  m07-02-sahne:
    baslik: Yanlış ray
    paneller:
      - gorsel: m07-02-a
        karakter: orhan
        alt: Kuklacı Orhan tren makasının koluna bağlı iplerle parlayan vagonları yanlış raya yönlendiriyor
        prompt: "A miniature railway junction at dusk with a lever switch: small glowing cargo wagons roll along a loop track and at the junction are routed onto either a green or a red track. The villain pulls glowing strings tied to the lever, diverting the wagons onto the red track."
        anlatici: Tren makası. Orhan'ın ipleri makasın kolunda; vagonlar yanlış raya sapıyor.
        balonlar:
          - kim: Orhan
            metin: Bir if, bir else… bir de benim koşulum.
            tur: konusma
            yer: sol-ust
            en: One if, one else… and then my condition.
          - kim: Tilki
            metin: Koşulu ters yazarsan tren de ters gider.
            tur: dusunce
            yer: sag-alt
            en: Write the condition backwards and the train goes backwards too.
        ses:
          metin: ŞAK!
          yer: sag-ust
        en:
          alt: Puppeteer Orhan, with strings tied to a railway switch lever, sends glowing carriages down the wrong track
          anlatici: A railway switch. Orhan's strings are on the lever; the carriages veer onto the wrong track.
          ses: CLACK!
    en:
      baslik: Wrong Track
  m07-03-sahne:
    baslik: Buruşuk zarf
    paneller:
      - gorsel: m07-03-a
        karakter: orhan
        alt: Postane ayrıştırma odasında Kuklacı Orhan'ın küçük robotları buruşuk bir zarfı kanala sokuyor
        prompt: A tidy little post office sorting room where envelopes of three distinct shapes slide down a chute into matching bins. Two of the villain's tiny robots, dangling on his glowing strings, sneak a crumpled glowing envelope into the chute while he watches from the doorway.
        anlatici: Postane ayrıştırma odası. Küçük robotlar bozuk bir zarfı kanala itiyor.
        balonlar:
          - kim: Orhan
            metin: Bozuk satır gelince program çöker. Çökünce de ben girerim.
            tur: konusma
            yer: sol-ust
            en: A malformed line crashes the program. And when it crashes, I walk in.
          - kim: Tilki
            metin: "try/except: hatayı yakala, logla, devam et."
            tur: dusunce
            yer: sag-alt
            en: "try/except: catch the error, log it, carry on."
        ses:
          metin: ÇATIRT!
          yer: sag-ust
        en:
          alt: In a post office sorting room, Puppeteer Orhan's little robots push a crumpled envelope into the chute
          anlatici: A post office sorting room. Little robots push a damaged envelope into the chute.
          ses: CRUNCH!
    en:
      baslik: The Crumpled Envelope
  m07-04-sahne:
    baslik: Sahte parmak izi
    paneller:
      - gorsel: m07-04-a
        karakter: orhan
        alt: Kuklacı Orhan parmak izi tarayıcısına sahte parmak izli bir eldiven tutuyor
        prompt: A sleek glowing fingerprint scanner device on a lab table, a unique fingerprint pattern shown on a floating screen above it. The villain holds up a rubber glove with a fake glowing fingerprint toward the scanner, while a large sieve nearby filters falling glowing shapes.
        anlatici: Parmak izi tarayıcısı. Orhan tarayıcıya sahte izli bir eldiven tutuyor.
        balonlar:
          - kim: Orhan
            metin: Aynı görünüyorsa aynıdır, değil mi?
            tur: konusma
            yer: sol-ust
            en: If it looks the same, it is the same, right?
          - kim: Tilki
            metin: Bir bayt değişse hash bambaşka olur.
            tur: dusunce
            yer: sag-alt
            en: Change one byte and the hash becomes something else entirely.
        ses:
          metin: BİP!
          yer: sag-ust
        en:
          alt: Puppeteer Orhan holds a glove with a fake fingerprint against a fingerprint scanner
          anlatici: A fingerprint scanner. Orhan holds a glove with a fake print against it.
          ses: BEEP!
    en:
      baslik: Fake Fingerprint
  m07-05-sahne:
    baslik: Kırmızı çubuk
    paneller:
      - gorsel: m07-05-a
        karakter: orhan
