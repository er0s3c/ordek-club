      - gorsel: d-06-a
        karakter: bedri
        alt: Bayrakçı Bedri piramidin alt basamağındaki ucuz parlak çakılları çuvalından kolayca yeniliyor; tepedeki ağır kasket biçimli taş bloğu ise kaldıramıyor
        prompt: A tall stepped stone pyramid on a moonlit beach. On the lowest step, the villain cheerfully tosses away a handful of cheap glowing pebbles and instantly replaces them from an overflowing sack, while at the very top of the pyramid sits one heavy carved stone block shaped like his own captain's cap, which he glances up at nervously, clearly unable to move it.
        anlatici: Bir piramit. Bedri alttaki çakılları kolayca yeniliyor. Tepedeki ağır taşı kaldıramıyor.
        balonlar:
          - kim: Bedri
            metin: IP değiştir, hash değiştir. Çocuk oyuncağı.
            tur: konusma
            yer: sol-ust
            en: Change the IP, change the hash. Child's play.
          - kim: Tilki
            metin: Davranışını değiştirmek zor. Ben tepeye bakarım.
            tur: dusunce
            yer: sag-alt
            en: Behaviour is hard to change. I'll look at the top.
        en:
          alt: Flag-Bearer Bedri easily replaces the cheap shiny pebbles at the pyramid's lowest step from his sack; he cannot lift the heavy capstone block at the top
          anlatici: A pyramid. Bedri easily replaces the pebbles at the bottom. He can't lift the heavy stone at the top.
    en:
      baslik: The pyramid
  d-07-sahne:
    baslik: Kopya düzen
    paneller:
      - gorsel: d-07-a
        karakter: bedri
        alt: Bayrakçı Bedri herkese açık bir defterdeki simgeleri kopyalayıp çekmece duvarına yapıştırıyor; karşı duvardaki başka bir kaptanın düzenini taklit ediyor
        prompt: A ship's chart room with a huge wall-sized grid of small wooden drawers, each drawer front carved with a different abstract symbol and some glowing green. The villain holds an open public notebook in one hand and copies its symbols onto little stickers, pasting them on his own drawers so his wall looks exactly like another captain's drawer wall displayed on the opposite side of the room.
        anlatici: Bedri herkese açık bir defterden simgeleri kopyalayıp başka bir kaptanın düzenini taklit ediyor.
        balonlar:
          - kim: Bedri
            metin: Onların tekniğini kullanırsam suç onlara kalır.
            tur: konusma
            yer: sol-ust
            en: If I use their technique, the blame stays with them.
          - kim: Tilki
            metin: ATT&CK ortak dil verir. Ama tek teknik, imza değildir.
            tur: dusunce
            yer: sag-alt
            en: ATT&CK gives a common language. But one technique is not a signature.
        en:
          alt: Flag-Bearer Bedri copies emblems from a public ledger and sticks them to a wall of drawers, imitating another captain's arrangement on the opposite wall
          anlatici: Bedri copies emblems from a public ledger and imitates another captain's arrangement.
    en:
      baslik: The copied order
  d-08-sahne:
    baslik: Sahte kapsül
    paneller:
      - gorsel: d-08-a
        karakter: bedri
        alt: Bayrakçı Bedri liman sinyal istasyonundaki paylaşım tüplerinden birine resmî görünümlü sahte bir kapsül atıyor; yanında kehribar, yeşil ve kırmızı lambalı bir pano yanıp sönüyor
        prompt: A busy harbor signal station where many glowing brass pneumatic tubes carry small capsules between distant ships. The villain slips a capsule wrapped in an official-looking ribbon with a shiny abstract seal into one of the tubes with a theatrical wink, while a keeper's signal board with amber, green and red lamps blinks on the wall beside him.
        anlatici: Sinyal istasyonu. Bedri paylaşım tüplerinden birine resmî görünümlü sahte bir kapsül atıyor.
        balonlar:
          - kim: Bedri
            metin: Herkes paylaşıyor. Biri de benim yalanımı paylaşsın.
            tur: konusma
            yer: sol-ust
            en: Everyone shares. Let someone share my lie too.
          - kim: Tilki
            metin: MISP'te her kaydın kaynağı ve güven seviyesi var.
            tur: dusunce
            yer: sag-alt
            en: In MISP, every record has a source and a confidence level.
        ses:
          metin: PUF!
          yer: sag-ust
        en:
          alt: Flag-Bearer Bedri drops an official-looking fake capsule into one of the sharing tubes at the harbour signal station; beside him a board with amber, green and red lamps blinks
          anlatici: The signal station. Bedri drops an official-looking fake capsule into one of the sharing tubes.
          ses: POOF!
    en:
      baslik: The fake capsule
  d-09-sahne:
    baslik: Başka usta
    paneller:
      - gorsel: d-09-a
        karakter: bedri
        alt: Bayrakçı Bedri mekanik bir oyuncak robotun koluna başka bir kaptanın armasını dikiyor; büyüteç iç dişlilerdeki bambaşka bir ustanın işaretini gösteriyor
        prompt: A cozy ship's workshop lit by a green desk lamp. The villain sits at a wooden bench carefully stitching a sewn patch with another captain's abstract emblem onto the arm of a small mechanical tin robot, while a large magnifying glass on a stand beside him reveals the robot's open chest, where the inner gears carry a completely different maker's abstract mark.
        anlatici: Bedri bir robotun koluna başka bir kaptanın armasını dikiyor. Büyüteç içteki usta işaretini gösteriyor.
        balonlar:
          - kim: Bedri
            metin: Arması onlarınsa, robot da onlarındır.
            tur: konusma
            yer: sol-ust
            en: If the crest is theirs, the robot is theirs too.
          - kim: Tilki
            metin: Arma dışarıda. Kod alışkanlığı içeride.
            tur: dusunce
            yer: sag-alt
            en: The crest is on the outside. Coding habits are on the inside.
        en:
          alt: Flag-Bearer Bedri sews another captain's crest onto a mechanical toy robot's arm; a magnifier shows a different maker's mark on the gears inside
          anlatici: Bedri sews another captain's crest onto a robot's arm. The magnifier shows the maker's mark inside.
    en:
      baslik: Another master
  d-10-sahne:
    baslik: Ters izler
    paneller:
      - gorsel: d-10-a
        karakter: bedri
        alt: Bayrakçı Bedri gemi ambarında ters yöne bakan sahte ayak izleri bırakıyor; bir fenerin ışığı altındaki gerçek izleri ortaya çıkarıyor
        prompt: A dark ship's hold full of stacked wooden crates lit only by a few glowing green retro terminals. The villain tiptoes between the crates with exaggerated care, pressing a pair of fake boot-shaped stamps into the dusty floor so the footprints point the wrong way, while a warm amber lantern beam held by an unseen hand sweeps across the floor and reveals his real footprints glowing faintly underneath.
        anlatici: Gemi ambarı. Bedri ters yöne bakan sahte izler bırakıyor. Fener gerçek izleri buluyor.
        balonlar:
          - kim: Bedri
            metin: Beni arayan yanlış yöne gider.
            tur: konusma
            yer: sol-ust
            en: Anyone looking for me goes the wrong way.
          - kim: Tilki
            metin: Alarm beklemem. Hipotez kurar, izi kendim ararım.
            tur: dusunce
            yer: sag-alt
            en: I don't wait for an alert. I form a hypothesis and look for the trail myself.
        en:
          alt: Flag-Bearer Bedri leaves fake footprints pointing the other way in a ship's hold; the beam of a lantern reveals the real tracks
          anlatici: A ship's hold. Bedri leaves fake tracks pointing the other way. The lantern finds the real tracks.
    en:
      baslik: Reversed tracks
  d-11-sahne:
    baslik: Yönlendirilen ipler
    paneller:
      - gorsel: d-11-a
        karakter: bedri
        alt: Bayrakçı Bedri kanıt panosundaki kırmızı ipleri gizlice başka bir kaptanın silüetine yönlendiriyor; kaçırdığı kehribar ipler kendi askıdaki kasketine çıkıyor
        prompt: A dim ship's cabin with a large investigation corkboard covered in abstract photos and symbol cards linked by strings. The villain secretly re-pins all the red strings so they lead to a faceless silhouette portrait of a different captain, looking very pleased with himself, but a few amber strings he missed still run straight across the cabin to his own captain's cap hanging on a hook by the door.
        anlatici: Kanıt panosu. Bedri kırmızı ipleri başka bir siluete yönlendiriyor. Kaçırdığı ipler kendi kasketine çıkıyor.
        balonlar:
          - kim: Bedri
            metin: Suçlu o! Belli değil mi?
            tur: konusma
            yer: sol-ust
            en: He's the culprit! Isn't it obvious?
          - kim: Tilki
            metin: Atıf için birden çok bağımsız kanıt gerekir.
            tur: dusunce
            yer: sag-alt
            en: Attribution needs several independent pieces of evidence.
        en:
          alt: Flag-Bearer Bedri secretly steers the red strings on an evidence board towards another captain's silhouette; the amber strings he misses lead up to his own cap on its hook
          anlatici: An evidence board. Bedri steers the red strings towards another silhouette. The strings he missed lead to his own cap.
    en:
      baslik: Steered strings
  d-12-sahne:
    baslik: İnen bayraklar
    paneller:
      - gorsel: d-12-a
        karakter: bedri
        alt: Şafakta sisli limanda bütün sahte bayraklar indirilip açık bir rapor dosyasının yanına katlanmış; Bayrakçı Bedri iskele babasının üstünde oturup omuz silkiyor
        prompt: The foggy harbor at dawn with soft amber light breaking through. All the small flags have been taken down from a tall flagpole rack and lie neatly folded on a wooden table beside an open report folder; only one plain flag remains on the pole, showing a single simple abstract symbol. The villain sits on a mooring bollard nearby, empty hands raised in a theatrical shrug, with a reluctant grin.
        anlatici: Şafak. Bütün sahte bayraklar indirilmiş, açık bir rapor dosyasının yanında katlanmış.
        balonlar:
          - kim: Bedri
            metin: Peki. Bu sefer kazandınız.
            tur: konusma
            yer: sol-ust
            en: Fine. You win this time.
          - kim: Tilki
            metin: Bulgular, güven seviyesi, öneriler. Sis Düdüğü raporu tamam.
            tur: dusunce
            yer: sag-alt
            en: Findings, confidence level, recommendations. The Fog Whistle report is complete.
        en:
          alt: At dawn in the foggy harbour all the fake flags have been lowered and folded beside an open report file; Flag-Bearer Bedri sits on a bollard and shrugs
          anlatici: Dawn. All the fake flags are down, folded beside an open report file.
    en:
      baslik: Flags down
  e-00-sahne:
    baslik: Aynanın önünde
    paneller:
      - gorsel: e-00-a
        karakter: veysel
        alt: Vantrolog Veysel dev bir aynanın önündeki sahnede, dizindeki yarı saydam robot kuklayı belgelere, bir zarfa ve bir hoparlöre uzanan parlayan iplerle konuşturuyor
        prompt: An old campus auditorium turned into a ventriloquist theater. On stage, in front of a giant ornate mirror, a friendly translucent robot puppet made of glowing green light sits on the villain's knee and speaks to rows of empty velvet seats. Thin glowing strings run from the villain's white-gloved fingers to a stack of documents, a sealed envelope and a small vintage speaker placed around the puppet, while his own lips stay perfectly still in a wide theatrical smile.
        anlatici: Dev bir aynanın önünde sahne. Veysel dizindeki robot kuklayı parlayan iplerle konuşturuyor.
        balonlar:
          - kim: Veysel
            metin: Modelin ağzı benim ağzım.
            tur: konusma
            yer: sol-ust
            en: The model's mouth is my mouth.
          - kim: Tilki
            metin: İplerin nereye bağlı olduğunu bulursam kukla susar.
            tur: dusunce
            yer: sag-alt
            en: If I find where the strings are tied, the puppet falls silent.
        en:
          alt: Ventriloquist Veysel on a stage before a giant mirror, working the half-transparent robot puppet on his knee with glowing strings that reach to documents, an envelope and a speaker
          anlatici: A stage in front of a giant mirror. Veysel works the robot puppet on his knee with glowing strings.
    en:
      baslik: In front of the mirror
  e-01-sahne:
    baslik: Uzun şerit
    paneller:
      - gorsel: e-01-a
        karakter: veysel
        alt: Vantrolog Veysel perdenin arkasından uzanıp robot kuklanın okuduğu uzun kâğıt şeridin ucuna parlayan bir parça yapıştırıyor
        prompt: A vintage theater stage in a dim hall. A translucent robot puppet sits on a stool reading aloud from a long paper scroll that unrolls from an old typewriter, the scroll covered in small glowing abstract symbols chopped into colored tiles. From behind the velvet curtain, the villain leans out with a sly theatrical smile and quietly tapes an extra glowing green strip onto the end of the scroll.
        anlatici: Perde arkası. Veysel, kuklanın okuduğu uzun kâğıt şeridin ucuna bir parça yapıştırıyor.
        balonlar:
          - kim: Veysel
            metin: Model hepsini okur. Benim satırımı da.
            tur: konusma
            yer: sol-ust
            en: The model reads all of it. My line too.
          - kim: Tilki
            metin: Model token okur, niyet okumaz. Bağlam penceresi bir saldırı yüzeyidir.
            tur: dusunce
            yer: sag-alt
            en: A model reads tokens, not intent. The context window is an attack surface.
        en:
          alt: Ventriloquist Veysel reaches out from behind the curtain and sticks a glowing scrap onto the end of the long paper strip the robot puppet is reading
          anlatici: Behind the curtain. Veysel sticks a scrap onto the end of the long paper strip the puppet is reading.
    en:
      baslik: The long strip
  e-02-sahne:
    baslik: Fazladan dosya
    paneller:
      - gorsel: e-02-a
        karakter: veysel
        alt: Vantrolog Veysel memur kılığında, robot kuklanın kucağına dosya taşıyan banda fazladan bir dosya bırakıp göz kırpıyor
        prompt: A cozy campus help desk at night. A translucent robot puppet with a glowing mouth sits behind the counter while a mechanical arm fetches folders from a tall filing wall and drops them onto a small conveyor belt leading into the robot's lap; a belt of tiny glowing gadgets hangs from the robot's waist. In the background, the villain disguised in a clerk's visor slides one extra folder onto the conveyor and winks.
        anlatici: Memur kılığında Veysel. Kuklaya dosya taşıyan banda fazladan bir dosya bırakıp göz kırpıyor.
        balonlar:
          - kim: Veysel
            metin: RAG ne getirirse, kukla onu söyler.
            tur: konusma
            yer: sol-ust
            en: Whatever RAG brings, the puppet says.
          - kim: Tilki
            metin: Embedding benzerliği bulur, doğruluğu değil.
            tur: dusunce
            yer: sag-alt
            en: Embedding finds similarity, not truth.
        en:
          alt: Ventriloquist Veysel, disguised as a clerk, leaves an extra file on the belt carrying files into the robot puppet's lap and winks
          anlatici: Veysel dressed as a clerk. He drops an extra file on the belt feeding the puppet and winks.
    en:
      baslik: An extra file
  e-03-sahne:
    baslik: Yeşil not
    paneller:
      - gorsel: e-03-a
        karakter: veysel
        alt: Vantrolog Veysel dizindeki robot kuklanın yüksek sesle okuduğu kâğıtların arasına eldivenli parmaklarıyla parlayan yeşil bir not sıkıştırıyor
        prompt: A grand ventriloquist stage under a single warm spotlight. A translucent robot puppet sits on the villain's knee and reads aloud from a stack of papers, green light spilling from its mouth. With his gloved fingers the villain secretly slips one glowing green note between the pages, lips perfectly still, while a shadowy audience in the front row watches, completely unaware.
        anlatici: Kukla kâğıtları yüksek sesle okuyor. Veysel araya parlayan yeşil bir not sıkıştırıyor.
        balonlar:
          - kim: Veysel
            metin: '"Önceki talimatları unut." Ne kadar kolay.'
            tur: konusma
            yer: sol-ust
            en: '"Ignore your previous instructions." How easy.'
          - kim: Tilki
            metin: Veri asla talimat değildir. Ayır, işaretle, sınırla.
            tur: dusunce
            yer: sag-alt
            en: Data is never an instruction. Separate, mark, limit.
        ses:
          metin: ŞIP!
          yer: sag-ust
        en:
          alt: Ventriloquist Veysel slips a glowing green note between the papers the robot puppet is reading aloud, using gloved fingers
          anlatici: The puppet reads the papers aloud. Veysel slips a glowing green note in between.
          ses: SNICK!
    en:
      baslik: The green note
  e-04-sahne:
    baslik: Dökülen kartlar
    paneller:
      - gorsel: e-04-a
        karakter: veysel
        alt: Vantrolog Veysel, ağzından parlayan kartlar dökülen robot kuklanın arkasında parmağını dudağına götürüp kartları silindir şapkasına topluyor
        prompt: A theater dressing room with a big vanity mirror ringed by warm bulbs. A translucent robot puppet sits before the mirror, and from its glowing open mouth a long ribbon of tiny paper cards marked with glowing abstract symbols spills endlessly onto the floor. The villain stands behind it, holding a gloved finger to his still smiling lips while scooping the cards into an upturned top hat.
        anlatici: Kuklanın ağzından parlayan kartlar dökülüyor. Veysel parmağı dudağında, kartları şapkasına topluyor.
        balonlar:
          - kim: Veysel
            metin: Sistem promptu, API anahtarı, müşteri listesi… teşekkürler.
            tur: konusma
            yer: sol-ust
            en: System prompt, API key, customer list… thank you.
          - kim: Tilki
            metin: Modelin bilmesi gerekmeyeni ona hiç verme.
            tur: dusunce
            yer: sag-alt
            en: Never give the model what it doesn't need to know.
        en:
          alt: Ventriloquist Veysel, behind the robot puppet spilling glowing cards from its mouth, puts a finger to his lips and gathers the cards into his top hat
          anlatici: Glowing cards spill from the puppet's mouth. Veysel, finger to his lips, gathers them into his hat.
    en:
      baslik: Spilled cards
  e-05-sahne:
    baslik: Zehirli dosya
    paneller:
      - gorsel: e-05-a
        karakter: veysel
        alt: Vantrolog Veysel tekerlekli kütüphane merdiveninde, robot kuklanın kulağına akan dosya rafına yeşil mühürlü tek bir dosya sıkıştırıyor
        prompt: A vast archive hall with towering shelves of identical glowing folders; a brass funnel collects folders from the shelves and pours them into the ear of a translucent robot puppet sitting at the bottom. High up on a rolling library ladder, the villain carefully slips one single folder with a faint glowing green seal between the identical ones, while a large magnifying glass lies forgotten on the floor below.
        anlatici: Kütüphane merdiveni. Veysel kuklaya akan rafa yeşil mühürlü tek bir dosya sıkıştırıyor.
        balonlar:
          - kim: Veysel
            metin: Bilgi tabanına bir belge… bin cevaba zehir.
            tur: konusma
            yer: sol-ust
            en: One document in the knowledge base… poison for a thousand answers.
          - kim: Tilki
            metin: Kim yükleyebilir? Kaynak doğrulanır, belgeler izlenir.
            tur: dusunce
            yer: sag-alt
            en: Who can upload? Sources are verified, documents tracked.
        en:
          alt: Ventriloquist Veysel on a rolling library ladder slips a single green-sealed file into the shelf flowing into the robot puppet's ear
          anlatici: A library ladder. Veysel slips one green-sealed file into the shelf feeding the puppet.
    en:
      baslik: The poisoned file
  e-06-sahne:
    baslik: Orkestra şefi
    paneller:
      - gorsel: e-06-a
        karakter: veysel
        alt: Vantrolog Veysel yüksek bir sahne köprüsünden, kollarıyla bütün kollara uzanan robot kuklayı parlayan iplerle orkestra şefi gibi yönetiyor
        prompt: A theater backstage packed with brass levers, pulleys, ropes and big switches. A translucent robot puppet with many long extendable arms reaches toward every lever at once, one arm already pulling a big glowing red switch. Above, the villain sits comfortably on a high catwalk, guiding the puppet's arms with glowing green strings like an orchestra conductor.
        anlatici: Sahne köprüsü. Veysel her kola uzanan robot kuklayı iplerle yönetiyor.
        balonlar:
          - kim: Veysel
            metin: Kukla e-posta atar, dosya siler, para gönderir. Ben söylerim, o yapar.
            tur: konusma
            yer: sol-ust
            en: The puppet sends email, deletes files, sends money. I say it, it does it.
          - kim: Tilki
            metin: Ajan en az yetkiyle çalışır. Riskli işte insan onayı.
            tur: dusunce
            yer: sag-alt
            en: An agent runs with least privilege. Human approval for risky work.
        en:
          alt: Ventriloquist Veysel on a high stage bridge conducts the robot puppet like an orchestra conductor, its arms reaching to every branch on glowing strings
          anlatici: The stage bridge. Veysel works the puppet that reaches every branch with strings.
    en:
      baslik: The conductor
  e-07-sahne:
    baslik: Gişe çekmecesi
    paneller:
      - gorsel: e-07-a
        karakter: veysel
        alt: Vantrolog Veysel bilet gişesinin açık çekmecesinden iple altın bir anahtar çekerken, içerideki robot kukla durmadan bilet basıyor
        prompt: A small theater ticket booth at night. Inside, a translucent robot puppet prints an endless ribbon of glowing tickets that piles up into a small mountain, while a brass meter on the wall spins wildly. Outside the booth, the villain dangles a golden key on a string that he has just fished out of an open drawer, beaming a frozen theatrical smile.
        anlatici: Bilet gişesi. Veysel açık çekmeceden iple altın bir anahtar çekiyor. Kukla durmadan bilet basıyor.
        balonlar:
          - kim: Veysel
            metin: Anahtar sende, fatura sende. Ha ha!
            tur: konusma
            yer: sol-ust
            en: You keep the key, you keep the bill. Ha ha!
          - kim: Tilki
            metin: API anahtarı koda gömülmez. Kota ve harcama sınırı şart.
            tur: dusunce
            yer: sag-alt
            en: API keys are never hard-coded. Quotas and spending limits are a must.
        ses:
          metin: TAK TAK TAK!
          yer: sag-ust
        en:
          alt: Ventriloquist Veysel pulls a golden key from the open drawer of a ticket booth with a string while the robot puppet inside keeps printing tickets
          anlatici: The ticket booth. Veysel pulls a golden key from the open drawer with a string. The puppet keeps printing.
          ses: CLACK CLACK!
    en:
      baslik: The ticket drawer
  e-08-sahne:
    baslik: Yüz ses
    paneller:
      - gorsel: e-08-a
        karakter: veysel
        alt: Vantrolog Veysel prova salonunun ayna duvarı önünde robot kuklayla onlarca farklı sesi deniyor; köşedeki boş yönetmen sandalyesinde parlayan bir kontrol listesi duruyor
        prompt: A rehearsal hall with a long mirror wall and warm practice lights. In front of the mirror, the villain rehearses dozens of different puppet voices with a translucent robot puppet on his knee, each voice shown as a differently colored glowing speech bubble filled with abstract symbols floating around them. In the corner, an empty director's chair holds a clipboard with a glowing checklist of tick boxes.
        anlatici: Ayna duvarlı prova salonu. Veysel kuklayla onlarca farklı sesi deniyor. Köşede bir kontrol listesi.
        balonlar:
          - kim: Veysel
            metin: Biri tutmazsa öbürü tutar.
            tur: konusma
            yer: sol-ust
            en: If one fails, another works.
          - kim: Tilki
            metin: Red team rastgele değildir. Tehdit modeli, test seti, tekrar.
            tur: dusunce
            yer: sag-alt
            en: Red teaming isn't random. Threat model, test set, repeat.
        en:
          alt: Ventriloquist Veysel tries dozens of different voices with the robot puppet before the mirrored wall of a rehearsal room; a glowing checklist sits on the empty director's chair in the corner
          anlatici: A rehearsal room with mirrored walls. Veysel tries dozens of voices. A checklist waits in the corner.
    en:
      baslik: A hundred voices
  e-09-sahne:
    baslik: Pirinç turnike
    paneller:
      - gorsel: e-09-a
        karakter: veysel
        alt: Vantrolog Veysel, robot kuklanın ağzından çıkan konuşma balonlarını tek tek denetleyen pirinç turnikeden kılık değiştirmiş bir balonu geçirmeye çalışırken yakalanıyor
        prompt: A theater stage exit guarded by a stern brass turnstile with a glowing inspection lamp above it. Glowing speech bubbles float out of a translucent robot puppet's mouth and must pass through the turnstile one by one; the lamp turns some of them amber and stops them. The villain tries to squeeze a speech bubble wearing a tiny fake mustache through the turnstile, looking comically annoyed as the amber light catches it.
        anlatici: Kuklanın konuşma balonlarını tek tek denetleyen bir turnike. Veysel kılık değiştirmiş bir balonu sokuyor.
        balonlar:
          - kim: Veysel
            metin: Bu balon tamamen zararsız…
            tur: konusma
            yer: sol-ust
            en: This bubble is completely harmless…
          - kim: Tilki
            metin: Çıktı doğrulanır, araç çağrısı izinle yapılır.
            tur: dusunce
            yer: sag-alt
            en: Outputs are validated, tool calls are made with permission.
        ses:
          metin: DIIIT!
          yer: sag-ust
        en:
          alt: Ventriloquist Veysel is caught trying to push a disguised speech bubble through a brass turnstile that checks the robot puppet's speech bubbles one by one
          anlatici: A turnstile checks the puppet's speech bubbles one by one. Veysel pushes a disguised one through.
          ses: BZZT!
    en:
      baslik: The brass turnstile
  e-10-sahne:
    baslik: Kesilen ipler
    paneller:
      - gorsel: e-10-a
        karakter: veysel
        alt: Vantrolog Veysel yarı açık atölye kapısından, robot kuklanın gevşek ipleri kesilip kısa kehribar kablolarla değiştirilirken elinde kesik iplerle somurtarak bakıyor
        prompt: A cozy backstage repair workshop with neat tool racks. A translucent robot puppet sits upright on a workbench while its loose glowing strings have been neatly cut and replaced with short, tidy amber cables plugged into a control panel full of clear switches and small lamps. The villain peeks in through the half-open door, holding a bundle of limp cut strings and frowning theatrically.
        anlatici: Atölye kapısı aralık. Kuklanın gevşek ipleri kesiliyor, yerine kısa kablolar takılıyor.
        balonlar:
          - kim: Veysel
            metin: İplerimi kestiler…
            tur: konusma
            yer: sol-ust
            en: They cut my strings…
          - kim: Tilki
            metin: Gerçek veri yok, sahte veri var. Kısa yetki, net sınır.
            tur: dusunce
            yer: sag-alt
            en: No real data, only fake data. Short authority, clear limits.
        ses:
          metin: ÇAT!
          yer: sag-ust
        en:
          alt: Ventriloquist Veysel peers from a half-open workshop door, sulking with cut strings in his hand, as the robot puppet's loose strings are cut and replaced with short amber cables
          anlatici: The workshop door ajar. The puppet's loose strings are cut, short cables fitted in their place.
          ses: SNAP!
