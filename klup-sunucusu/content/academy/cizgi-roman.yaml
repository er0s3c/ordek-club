        prompt: "A dark theater seen from the balcony, where an auditor's desk with a glowing checklist faces the stage. Ten bright spotlights shine down, each lighting a different trick prop of the villain on the stage floor: a hidden note, a golden key, a forged folder, a mask that copies a face, a microphone that copies a voice. The villain stands caught in the center of all the beams, squinting into the light and making a sheepish theatrical bow."
        anlatici: On spot ışığı. Her biri Veysel'in başka bir numarasını aydınlatıyor.
        balonlar:
          - kim: Veysel
            metin: Bütün numaralarım… bir listede mi?
            tur: konusma
            yer: sol-ust
            en: All my tricks… on a list?
          - kim: Tilki
            metin: OWASP LLM Top 10. Her riske bir test.
            tur: dusunce
            yer: sag-alt
            en: OWASP LLM Top 10. One test for every risk.
        ses:
          metin: KLAK KLAK!
          yer: sag-ust
        en:
          alt: Ventriloquist Veysel is caught in the middle of ten spotlights; each one lights up another of his tricks, and he squints through an embarrassed bow
          anlatici: Ten spotlights. Each one lights up another of Veysel's tricks.
          ses: CLAP CLAP!
