            metin: Yazmadığın kod da senin sorumluluğun. Envanter ve güncelleme.
            tur: dusunce
            yer: sag-alt
            en: Code you didn't write is still your responsibility. Inventory and updates.
        en:
          alt: Single-Quote Jasmine drops a glowing green seed into a crate of plugin parts on a factory line; further along, dozens of site houses are built from the same parts
          anlatici: The plugin factory. Jasmine drops a seed into a crate. Further on, dozens of sites are built from the same parts.
