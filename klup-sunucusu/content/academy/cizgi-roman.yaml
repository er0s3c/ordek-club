            metin: "Yarış durumu: kontrol ile kullanım arasında kilit olmalı."
            tur: dusunce
            yer: sag-alt
            en: "Race condition: there must be a lock between check and use."
        ses:
          metin: DAMGA DAMGA!
          yer: sag-ust
        en:
          alt: Identical copies of Single-Quote Jasmine all thrust the same glowing coupon at the till at once; the cashier robot stamps every one
